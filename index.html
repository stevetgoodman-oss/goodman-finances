<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Goodman Finances Inc.</title>

<style>
:root {
  --navy: #0B1F3A;
  --navy-2: #102A4C;
  --blue: #2563EB;
  --bg: #F3F6FA;
  --card: #FFFFFF;
  --text: #111827;
  --muted: #64748B;
  --border: #E5E7EB;
  --green: #059669;
  --green-bg: #ECFDF5;
  --amber: #D97706;
  --amber-bg: #FFFBEB;
  --red: #DC2626;
  --red-bg: #FEF2F2;
  --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
}

main {
  max-width: 760px;
  margin: 0 auto;
  padding: 16px;
  padding-bottom: 90px;
}

.app-header {
  padding: 10px 2px 14px;
}

.app-title {
  font-size: 28px;
  line-height: 1.1;
  font-weight: 800;
  letter-spacing: -0.04em;
  color: var(--navy);
  margin: 0;
}

.app-subtitle {
  color: var(--muted);
  margin-top: 6px;
  font-size: 14px;
}

.tabs {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  gap: 8px;
  margin: 0 -16px 16px;
  padding: 10px 16px;
  background: rgba(243, 246, 250, 0.92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(226, 232, 240, 0.7);
}

.tabs button {
  flex: 1;
  border: 0;
  border-radius: 999px;
  padding: 12px;
  font-weight: 800;
  background: #E2E8F0;
  color: var(--navy);
}

.tabs button.active {
  background: var(--navy);
  color: white;
  box-shadow: 0 8px 18px rgba(11,31,58,0.18);
}

.mode-toggle {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  background: #E2E8F0;
  border-radius: 999px;
  padding: 5px;
  margin: 8px 0 16px;
}

.mode-toggle button {
  border: 0;
  border-radius: 999px;
  padding: 11px 12px;
  font-weight: 850;
  background: transparent;
  color: var(--navy);
}

.mode-toggle button.active {
  background: white;
  color: var(--navy);
  box-shadow: 0 6px 16px rgba(15, 23, 42, 0.12);
}

.mode-note {
  margin-top: -6px;
  margin-bottom: 14px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.35;
}

.hero-card {
  background: linear-gradient(135deg, var(--navy), var(--navy-2));
  color: white;
  border-radius: 24px;
  padding: 20px;
  margin-bottom: 14px;
  box-shadow: 0 16px 36px rgba(11, 31, 58, 0.22);
}

.hero-label {
  font-size: 13px;
  opacity: 0.78;
  margin-bottom: 6px;
}

.hero-value {
  font-size: 34px;
  line-height: 1.05;
  font-weight: 900;
  letter-spacing: -0.05em;
}

.hero-context {
  font-size: 14px;
  opacity: 0.88;
  margin-top: 8px;
  line-height: 1.4;
}

.hero-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 16px;
}

.hero-metric {
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 16px;
  padding: 12px;
}

.hero-metric span {
  display: block;
  font-size: 12px;
  opacity: 0.76;
}

.hero-metric strong {
  display: block;
  margin-top: 4px;
  font-size: 18px;
}

.card, .summary, .panel {
  background: var(--card);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
  border: 1px solid rgba(226,232,240,0.9);
}

.section-title {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin: 22px 0 10px;
}

.section-title h2 {
  margin: 0;
  font-size: 20px;
  letter-spacing: -0.02em;
  color: var(--navy);
}

.section-title span {
  color: var(--muted);
  font-size: 13px;
}

.metric-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}

.metric-row:last-child {
  border-bottom: 0;
}

.metric-row span {
  color: var(--muted);
}

.metric-row strong {
  font-size: 18px;
}

.health-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 14px;
}

.health-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 14px;
  box-shadow: 0 4px 14px rgba(15,23,42,0.04);
}

.health-card .label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .04em;
}

.health-card .value {
  display: block;
  margin-top: 6px;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: -0.04em;
  color: var(--navy);
}

.health-card .note {
  color: var(--muted);
  font-size: 12px;
  margin-top: 4px;
}

details.category-card {
  background: var(--card);
  border-radius: 18px;
  padding: 14px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  border: 1px solid rgba(226,232,240,0.9);
}

details.category-card summary {
  list-style: none;
  display: block;
  cursor: pointer;
}

details.category-card summary::-webkit-details-marker {
  display: none;
}

.category-top {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: flex-start;
}

.category-name {
  font-weight: 850;
  font-size: 16px;
  color: var(--navy);
}

.category-sub {
  color: var(--muted);
  font-size: 13px;
  margin-top: 4px;
}

.category-amount {
  text-align: right;
  font-weight: 850;
  white-space: nowrap;
}

.status-chip {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  padding: 4px 9px;
  font-size: 12px;
  font-weight: 800;
  margin-top: 6px;
}

.status-good {
  color: var(--green);
  background: var(--green-bg);
}

.status-watch {
  color: var(--amber);
  background: var(--amber-bg);
}

.status-bad {
  color: var(--red);
  background: var(--red-bg);
}

.progress {
  height: 8px;
  border-radius: 999px;
  background: #E5E7EB;
  overflow: hidden;
  margin-top: 12px;
}

.progress-fill {
  height: 100%;
  border-radius: 999px;
  background: var(--green);
  width: 0%;
}

.progress-fill.watch {
  background: var(--amber);
}

.progress-fill.bad {
  background: var(--red);
}

.sub-row {
  display: flex;
  justify-content: space-between;
  border-top: 1px solid #F1F5F9;
  padding: 9px 0;
  color: var(--text);
}

.sub-row span {
  color: var(--muted);
}

.empty {
  color: var(--muted);
  font-size: 13px;
  padding: 10px 0 2px;
}

.transaction {
  background: white;
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  box-shadow: 0 4px 14px rgba(15,23,42,0.05);
  border: 1px solid var(--border);
}

.transaction strong {
  color: var(--navy);
}

.transaction-actions {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  justify-content: flex-end;
}

button, input, select {
  font: inherit;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 9px 11px;
  background: #E2E8F0;
  color: var(--navy);
  font-weight: 700;
}

button.primary {
  background: var(--navy);
  color: white;
  width: 100%;
  margin-top: 8px;
  padding: 12px;
}

input, select {
  width: 100%;
  padding: 12px;
  margin: 6px 0;
  border: 1px solid #CBD5E1;
  border-radius: 12px;
  box-sizing: border-box;
  background: white;
}

.pill {
  display: inline-block;
  padding: 4px 9px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 800;
  background: var(--amber-bg);
  color: var(--amber);
  margin-top: 6px;
}

.muted {
  color: var(--muted);
  font-size: 13px;
}

.good { color: var(--green); }
.bad { color: var(--red); }
.watch { color: var(--amber); }

@media (max-width: 480px) {
  main { padding: 14px; padding-bottom: 80px; }
  .hero-value { font-size: 30px; }
  .health-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<body>
<div id="app"></div>

<script>
const categoryModel = {
  "Mortgage": ["Home loan repayment"],
  "Household": ["AGL gas & electricity", "Water", "Rates", "Home insurance"],
  "Transport": ["Petrol", "Car insurance", "Car rego", "Tolls", "MYKI"],
  "Living": ["Groceries", "Chemist", "Home Maintenance"],
  "Lifestyle": ["Coffee", "Takeaway", "Steve Lou entertainment", "Retail shopping", "Vanity"],
  "Kids": ["Kids swimming lessons", "Mila gymnastics", "Mila Acro", "Mila school fees", "Miscellaneous kids"],
  "Subscriptions": ["Netflix", "Amazon", "Spotify", "Stronglifts 5x5 app", "Doordash app subscription", "Hayu", "Disney", "HBO", "Apple storage", "Google storage", "MCC membership", "Chat GPT", "HBO & Simply Draw"],
  "Utilities / Personal": ["Phone and internet", "Gym"],
  "Buffer / Price Increases": ["General buffer", "Annual increases", "Unexpected bill movement"],
  "Needs Review": ["Needs Review", "ATM Withdrawal", "Unmapped Transaction"],
  "Income": ["Salary", "Bonus", "Other income"],
  "Investing / Savings": ["ETFs", "Super", "Savings"]
};

const budgets = {
  "Mortgage": 6600,
  "Household": 891,
  "Transport": 371,
  "Living": 1275,
  "Lifestyle": 1133,
  "Kids": 635,
  "Subscriptions": 91,
  "Utilities / Personal": 279,
  "Buffer / Price Increases": 150,
  "Investing / Savings": 0
};

const budgetStartDate = "2026-05-01";

let activeTab = "dashboard";
let viewMode = "monthly";
let transactions = JSON.parse(localStorage.getItem("transactions") || "[]");

function save() {
  localStorage.setItem("transactions", JSON.stringify(transactions));
  render();
}

function dollars(value, decimals = 0) {
  return "$" + Number(value || 0).toLocaleString("en-AU", {
    minimumFractionDigits: decimals,
    maximumFractionDigits: decimals
  });
}

function dollarsExact(value) {
  return "$" + Number(value || 0).toLocaleString("en-AU", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function normaliseText(text) {
  return String(text || "").toUpperCase().trim();
}

function parseDate(value) {
  if (!value) return "";
  const raw = String(value).trim();

  if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;

  const parts = raw.split(/[\/\-]/);
  if (parts.length === 3) {
    let [d, m, y] = parts;
    if (y.length === 2) y = "20" + y;
    return `${y.padStart(4, "0")}-${m.padStart(2, "0")}-${d.padStart(2, "0")}`;
  }

  return raw;
}

function isOnOrAfterBudgetStart(dateString) {
  return new Date(dateString) >= new Date(budgetStartDate);
}

function isThisMonth(dateString) {
  const d = new Date(dateString);
  const now = new Date();

  return (
    d.getMonth() === now.getMonth() &&
    d.getFullYear() === now.getFullYear() &&
    isOnOrAfterBudgetStart(dateString)
  );
}

function monthsElapsedSinceBudgetStart() {
  const start = new Date(budgetStartDate);
  const now = new Date();

  if (now < start) return 0;

  return (
    (now.getFullYear() - start.getFullYear()) * 12 +
    (now.getMonth() - start.getMonth()) +
    1
  );
}

const categoryBehaviour = {
  "Mortgage": "target",
  "Investing / Savings": "target",
  "Household": "spend",
  "Transport": "spend",
  "Living": "spend",
  "Lifestyle": "spend",
  "Kids": "spend",
  "Subscriptions": "spend",
  "Utilities / Personal": "spend",
  "Buffer / Price Increases": "spend"
};

function setTab(tab) {
  activeTab = tab;
  render();
}

function setViewMode(mode) {
  viewMode = mode;
  render();
}

function isTargetCategory(parent) {
  return categoryBehaviour[parent] === "target";
}

function transactionCountsForBudget(t) {
  return t.type === "expense";
}

function transactionCountsForIncome(t) {
  return t.type === "income";
}

function expenseValue(t) {
  // Purchases are usually negative. Refunds/returns are positive and should reduce actual spend.
  if (t.amount < 0) return Math.abs(t.amount);
  return -Math.abs(t.amount);
}

function getVisibleTransactions() {
  return transactions.filter(t => !t.hidden);
}

function getThisMonthTransactions() {
  return getVisibleTransactions().filter(t => isThisMonth(t.date));
}

function getTransactionsSinceBudgetStart() {
  return getVisibleTransactions().filter(t => isOnOrAfterBudgetStart(t.date));
}

function getAllVisibleTransactions() {
  return getVisibleTransactions()
    .slice()
    .sort((a, b) => new Date(b.date) - new Date(a.date));
}

function getNeedsReviewTransactions() {
  return getVisibleTransactions()
    .filter(t => t.type === "needs_review")
    .slice()
    .sort((a, b) => new Date(b.date) - new Date(a.date));
}

function getThisMonthParentTotals() {
  const totals = {};
  Object.keys(budgets).forEach(cat => totals[cat] = 0);

  getThisMonthTransactions().forEach(t => {
    if (transactionCountsForBudget(t) && totals[t.parent] !== undefined) {
      totals[t.parent] += expenseValue(t);
    }
  });

  return totals;
}

function getAccrualParentTotals() {
  const totals = {};
  Object.keys(budgets).forEach(cat => totals[cat] = 0);

  getTransactionsSinceBudgetStart().forEach(t => {
    if (transactionCountsForBudget(t) && totals[t.parent] !== undefined) {
      totals[t.parent] += expenseValue(t);
    }
  });

  return totals;
}

function getSubTotals(parent, mode = "month") {
  const totals = {};
  const txSource =
    mode === "accrual"
      ? getTransactionsSinceBudgetStart()
      : getThisMonthTransactions();

  txSource
    .filter(t => t.parent === parent && transactionCountsForBudget(t))
    .forEach(t => {
      totals[t.sub] = (totals[t.sub] || 0) + expenseValue(t);
    });

  return totals;
}

function getMonthlySummary() {
  const monthTx = getThisMonthTransactions();

  const income = monthTx
    .filter(transactionCountsForIncome)
    .reduce((sum, t) => sum + Math.abs(t.amount), 0);

  const expenses = monthTx
    .filter(transactionCountsForBudget)
    .reduce((sum, t) => sum + expenseValue(t), 0);

  return { income, expenses, surplus: income - expenses };
}

function getAccrualSummary() {
  const monthsElapsed = monthsElapsedSinceBudgetStart();
  const accrualTotals = getAccrualParentTotals();

  let totalBudgetAccrued = 0;
  let totalActualSpent = 0;

  Object.keys(budgets).forEach(parent => {
    totalBudgetAccrued += budgets[parent] * monthsElapsed;
    totalActualSpent += accrualTotals[parent] || 0;
  });

  return {
    monthsElapsed,
    totalBudgetAccrued,
    totalActualSpent,
    balance: totalBudgetAccrued - totalActualSpent
  };
}

function getCategoryStatus(actual, budget, parent) {
  if (budget === 0) return { label: "Tracking", cls: "status-good", fill: "progress-fill", pct: 0 };

  const pct = actual / budget;
  const cappedPct = Math.min(pct * 100, 100);

  if (isTargetCategory(parent)) {
    if (pct >= 1) return { label: "Target met", cls: "status-good", fill: "progress-fill", pct: cappedPct };
    if (pct >= 0.8) return { label: "Close", cls: "status-watch", fill: "progress-fill watch", pct: cappedPct };
    return { label: "Behind target", cls: "status-bad", fill: "progress-fill bad", pct: cappedPct };
  }

  if (pct > 1) return { label: "Over", cls: "status-bad", fill: "progress-fill bad", pct: cappedPct };
  if (pct >= 0.8) return { label: "Watch", cls: "status-watch", fill: "progress-fill watch", pct: cappedPct };
  return { label: "Healthy", cls: "status-good", fill: "progress-fill", pct: cappedPct };
}

function getCategoryResultText(parent, actual, budget, mode) {
  const difference = budget - actual;

  if (isTargetCategory(parent)) {
    if (difference <= 0) return dollars(Math.abs(difference)) + " over target";
    return dollars(difference) + " short of target";
  }

  if (mode === "monthly") {
    if (difference >= 0) return dollars(difference) + " remaining";
    return dollars(Math.abs(difference)) + " over";
  }

  if (difference >= 0) return dollars(difference) + " ahead";
  return dollars(Math.abs(difference)) + " behind";
}

function getCategoryResultClass(parent, actual, budget) {
  const difference = budget - actual;

  if (isTargetCategory(parent)) {
    return difference <= 0 ? "good" : "bad";
  }

  return difference >= 0 ? "good" : "bad";
}

function updateSubCategories(parentValue) {
  const subSelect = document.getElementById("sub");
  if (!subSelect) return;

  subSelect.innerHTML = categoryModel[parentValue]
    .map(sub => `<option value="${sub}">${sub}</option>`)
    .join("");
}

function addTransaction(e) {
  e.preventDefault();

  const form = e.target;
  const amount = parseFloat(form.amount.value);
  const parent = form.parent.value;

  let type = "expense";
  if (parent === "Income") type = "income";
  if (parent === "Needs Review") type = "needs_review";

  transactions.push({
    id: Date.now(),
    date: form.date.value,
    amount,
    type,
    parent,
    sub: form.sub.value,
    note: form.note.value,
    hidden: false,
    imported: false
  });

  save();
}

function deleteTransaction(id) {
  transactions = transactions.filter(t => t.id !== id);
  save();
}

function editTransaction(id) {
  const t = transactions.find(t => t.id === id);
  if (!t) return;

  const newAmount = prompt("Amount", t.amount);
  if (newAmount === null) return;

  const newParent = prompt("Parent category", t.parent);
  if (newParent === null) return;

  const validParent = categoryModel[newParent] ? newParent : "Needs Review";
  const validSubs = categoryModel[validParent];

  const newSub = prompt("Sub-category", t.sub);
  if (newSub === null) return;

  const newNote = prompt("Note / merchant", t.note || "");
  if (newNote === null) return;

  t.amount = parseFloat(newAmount);
  t.parent = validParent;
  t.sub = validSubs.includes(newSub) ? newSub : validSubs[0];
  t.note = newNote;
  t.hidden = false;

  if (t.parent === "Income") {
    t.type = "income";
  } else if (t.parent === "Needs Review") {
    t.type = "needs_review";
  } else {
    t.type = "expense";
  }

  save();
}

function parseCSV(text) {
  const rows = [];
  let current = "";
  let row = [];
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const next = text[i + 1];

    if (char === '"' && inQuotes && next === '"') {
      current += '"';
      i++;
    } else if (char === '"') {
      inQuotes = !inQuotes;
    } else if (char === "," && !inQuotes) {
      row.push(current.trim());
      current = "";
    } else if ((char === "\n" || char === "\r") && !inQuotes) {
      if (current || row.length) {
        row.push(current.trim());
        rows.push(row);
      }
      current = "";
      row = [];
      if (char === "\r" && next === "\n") i++;
    } else {
      current += char;
    }
  }

  if (current || row.length) {
    row.push(current.trim());
    rows.push(row);
  }

  return rows;
}

function classifyTransaction(description, amount) {
  const d = normaliseText(description);

  if (d.includes("ATM") || d.includes("CASH WITHDRAWAL")) {
    return { type: "needs_review", parent: "Needs Review", sub: "ATM Withdrawal", hidden: false };
  }

  // Income
  if (
    d.includes("SALARY") ||
    d.includes("PAYROLL") ||
    d.includes("WAGES") ||
    d.includes("TELSTRA CORPORAT") ||
    d.includes("EML PAYMENTS") ||
    d.includes("DIR DEP EML")
  ) {
    return { type: "income", parent: "Income", sub: "Salary", hidden: false };
  }

  // Known payments that look like transfers but are real expenses
  if (d.includes("STARFISH SWIM")) {
    return { type: "expense", parent: "Kids", sub: "Kids swimming lessons", hidden: false };
  }

  // Manual/adhoc incoming transfers should be reviewed, not hidden
  if (d.includes("FAST TRANSFER FROM")) {
    return { type: "needs_review", parent: "Needs Review", sub: "Needs Review", hidden: false };
  }

  // Internal movements and credit card repayments
  if (
    d.includes("PAYMENT RECEIVED") ||
    d.includes("CREDIT CARD PAYMENT") ||
    d.includes("TRANSFER TO XX") ||
    d.includes("TRANSFER FROM XX") ||
    d.includes("HOME LOAN TRANSFER")
  ) {
    return { type: "ignored", parent: "Ignored", sub: "Internal Transfer", hidden: true };
  }

  if (d.includes("HOME LOAN PYMT") || d.includes("MORTGAGE")) {
    return { type: "expense", parent: "Mortgage", sub: "Home loan repayment", hidden: false };
  }

  if (d.includes("INTERNATIONAL TRANSACTION FEE") || d.includes("INTNL TRANSACTION FEE")) {
    return { type: "expense", parent: "Buffer / Price Increases", sub: "General buffer", hidden: false };
  }

  const rules = [
    // Kids
    { keys: ["DANNY FRAWLEY"], parent: "Kids", sub: "Kids swimming lessons" },
    { keys: ["WAVERLEY GYMNASTICS"], parent: "Kids", sub: "Mila gymnastics" },
    { keys: ["THEATREDELEDANSE", "THEATRE DE LA DANSE", "PAYRIX*THEATREDELEDANSE"], parent: "Kids", sub: "Mila Acro" },
    { keys: ["SPRIGGY SCHOOLS", "HEALTHLINK CREW"], parent: "Kids", sub: "Miscellaneous kids" },

    // Mortgage and household

  }

  if (amount > 0) {

function makeFingerprint(tx) {
  return [tx.date, Number(tx.amount).toFixed(2), normaliseText(tx.note)].join("|");
}

function findColumn(headers, candidates) {
  const normalised = headers.map(h => normaliseText(h));

  for (const candidate of candidates) {
    const index = normalised.findIndex(h => h.includes(candidate));
    if (index !== -1) return index;
  }

  return -1;
}

function importCSVFile(file) {
  const reader = new FileReader();

  reader.onload = function(evt) {
    const rows = parseCSV(evt.target.result).filter(r => r.length > 1);

    if (rows.length < 2) {
      alert("No transactions found.");
      return;
    }

    const headers = rows[0];

    const dateIndex = findColumn(headers, ["DATE"]);
    const descIndex = findColumn(headers, ["DESCRIPTION", "TRANSACTION", "DETAILS", "NARRATIVE"]);
    const amountIndex = findColumn(headers, ["AMOUNT"]);

    if (dateIndex === -1 || descIndex === -1 || amountIndex === -1) {
      alert("Could not identify Date, Description and Amount columns.");
      return;
    }

    const existing = new Set(transactions.map(makeFingerprint));

    let imported = 0;
    let skipped = 0;
    let ignored = 0;
    let needsReview = 0;

    rows.slice(1).forEach(row => {
      const date = parseDate(row[dateIndex]);
      const note = row[descIndex];
      const amount = parseFloat(String(row[amountIndex]).replace(/[$,]/g, ""));

      if (!date || !note || isNaN(amount)) return;

      const classification = classifyTransaction(note, amount);

      const tx = {
        id: Date.now() + Math.random(),
        date,
        amount,
        type: classification.type,
        parent: classification.parent,
        sub: classification.sub,
        note,
        hidden: classification.hidden,
        imported: true
      };

      const fingerprint = makeFingerprint(tx);

      if (existing.has(fingerprint)) {
        skipped++;
        return;
      }

      existing.add(fingerprint);
      transactions.push(tx);
      imported++;

      if (tx.hidden) ignored++;
      if (tx.type === "needs_review") needsReview++;
    });

    save();

    alert(`Import complete. Imported ${imported}. Skipped duplicates ${skipped}. Hidden transfers ${ignored}. Needs review ${needsReview}.`);
  };

  reader.readAsText(file);
}

function handleCSVUpload(e) {
  const files = Array.from(e.target.files || []);
  files.forEach(importCSVFile);
  e.target.value = "";
}

    .filter(([parent, amount]) => amount > 0)

        <span class="label">Actual spend</span>

        <div class="note">Matched transactions</div>
      </div>

        <span class="label">Needs review</span>

        <div class="note">${needsReviewCount ? dollars(needsReviewTotal) + " requires classification" : "All clear"}</div>
      </div>

  `;

  const categoryRows = Object.keys(budgets).map(parent => {
    const monthlyBudget = budgets[parent];
    const comparisonBudget = viewMode === "monthly" ? monthlyBudget : monthlyBudget * monthsElapsed;
    const actual = activeTotals[parent] || 0;
    const resultText = getCategoryResultText(parent, actual, comparisonBudget, viewMode);
    const resultClass = getCategoryResultClass(parent, actual, comparisonBudget);
    const status = getCategoryStatus(actual, comparisonBudget || monthlyBudget, parent);
    const subTotals = getSubTotals(parent, viewMode === "monthly" ? "month" : "accrual");

    const topSubText = viewMode === "monthly"
      ? `${dollars(actual)} of ${dollars(monthlyBudget)} used`
      : `Accrued ${dollars(comparisonBudget)} · Spent ${dollars(actual)}`;

    const detailLine = viewMode === "monthly"
      ? `Monthly budget: ${dollars(monthlyBudget)} · Actual: ${dollars(actual)}`
      : `Monthly accrual: ${dollars(monthlyBudget)} · Months elapsed: ${monthsElapsed}`;

    const emptyText = viewMode === "monthly"
      ? "No spend this month"
      : "No spend since budget start";

    const subBreakdown = Object.keys(subTotals).length
      ? Object.entries(subTotals).sort((a, b) => b[1] - a[1]).map(([sub, amount]) => `
        <div class="sub-row"><span>${sub}</span><strong>${dollars(amount)}</strong></div>
      `).join("")
      : `<div class="empty">${emptyText}</div>`;

    return `
      <details class="category-card">
        <summary>
          <div class="category-top">
            <div>
              <div class="category-name">${parent}</div>
              <div class="category-sub">${topSubText}</div>
              <span class="status-chip ${status.cls}">${status.label}</span>
            </div>
            <div class="category-amount ${resultClass}">
              ${resultText}
            </div>
          </div>
          <div class="progress">
            <div class="${status.fill}" style="width:${status.pct}%"></div>
          </div>
        </summary>
        <div class="budget-line">${detailLine}</div>
        <div>${subBreakdown}</div>

  }).join("");

  return `

      <div class="hero-label">Financial position</div>
      <div class="hero-value">
        ${
          viewMode === "monthly"
            ? monthlySummary.surplus >= 0
              ? dollars(monthlySummary.surplus) + " remaining"
              : dollars(Math.abs(monthlySummary.surplus)) + " over"
            : accrualSummary.balance >= 0

    ${healthCards}

    <div class="section-title">
      <h2>Dashboard view</h2>
      <span>${activeSubtitle}</span>
    </div>
    <div class="mode-toggle">
      <button class="${viewMode === "monthly" ? "active" : ""}" onclick="setViewMode('monthly')">Monthly</button>

    </section>

      <div class="metric-row"><span>Budget accrued</span><strong>${dollars(accrualSummary.totalBudgetAccrued)}</strong></div>
      <div class="metric-row"><span>Actual spent</span><strong>${dollars(accrualSummary.totalActualSpent)}</strong></div>

    </div>

  `;
}
function renderTransactionHistory() {
  const parentOptions = Object.keys(categoryModel)
    .map(parent => `<option value="${parent}">${parent}</option>`)
    .join("");

  const needsReview = getNeedsReviewTransactions();
  const needsReviewTotal = needsReview.reduce((sum, t) => sum + Math.abs(t.amount), 0);
  const allTransactions = getAllVisibleTransactions();

  const renderList = list => list.length
    ? list.map(t => `
      <div class="transaction">
        <div>
          <strong>${t.sub}</strong>
          <div class="muted">${t.parent} · ${t.date}${t.note ? " · " + t.note : ""}</div>
          ${t.type === "needs_review" ? `<span class="pill">Needs review</span>` : ""}
        </div>
        <div>
          <strong>${t.amount < 0 ? "-" : "+"}${dollarsExact(Math.abs(t.amount))}</strong>
          <div class="transaction-actions">
            <button onclick="editTransaction(${t.id})">Edit</button>
            <button onclick="deleteTransaction(${t.id})">Delete</button>
          </div>
        </div>
      </div>
    `).join("")
    : `<p class="muted">No transactions to show.</p>`;

  return `
    <section class="panel">
      <h2>Import CSV</h2>
      <p class="muted">Import CBA CSVs. Transfers and credit card repayments are hidden. ATM withdrawals and unmapped items go to Needs Review.</p>
      <input type="file" accept=".csv" multiple onchange="handleCSVUpload(event)" />
    </section>

    <section class="panel">
      <h2>Add Transaction</h2>
      <form onsubmit="addTransaction(event)">
        <input type="date" name="date" required />
        <input type="number" step="0.01" name="amount" placeholder="Amount (+ income / - expense)" required />

        <select name="parent" id="parent" onchange="updateSubCategories(this.value)" required>
          ${parentOptions}
        </select>

        <select name="sub" id="sub" required></select>

        <input type="text" name="note" placeholder="Note / merchant" />
        <button class="primary">Add Transaction</button>
      </form>
    </section>

    <div class="section-title">
      <h2>Needs Review</h2>
      <span>${needsReview.length} items · ${dollars(needsReviewTotal)} unallocated</span>
    </div>
    ${renderList(needsReview)}

    <div class="section-title">
      <h2>All Visible Transactions</h2>
      <span>${allTransactions.length} items</span>
    </div>
    <p class="muted">Hidden transfers and credit card repayments do not appear here.</p>
    ${renderList(allTransactions)}
  `;
}

function render() {
  document.getElementById("app").innerHTML = `
    <main>
      <div class="app-header">
        <h1 class="app-title">Goodman Finances Inc.</h1>
        <div class="app-subtitle">Household financial control system</div>
      </div>

      <div class="tabs">
        <button class="${activeTab === "dashboard" ? "active" : ""}" onclick="setTab('dashboard')">Dashboard</button>
        <button class="${activeTab === "transactions" ? "active" : ""}" onclick="setTab('transactions')">Transaction History</button>

      ${activeTab === "dashboard" ? renderDashboard() : renderTransactionHistory()}
