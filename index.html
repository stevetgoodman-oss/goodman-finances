<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Goodman Finances Inc.</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f4f4f5;
  color: #111827;
}

main {
  max-width: 720px;
  margin: 0 auto;
  padding: 16px;
  padding-bottom: 80px;
}

h1 { font-size: 28px; margin: 8px 0 16px; }
h2 { font-size: 20px; margin: 20px 0 10px; }

.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}

.tabs button {
  flex: 1;
  border: 0;
  border-radius: 999px;
  padding: 12px;
  font-weight: 700;
  background: #e5e7eb;
}

.tabs button.active {
  background: #111827;
  color: white;
}

.summary, .card, .panel {
  background: white;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.06);
}

.metric {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid #eee;
}

.metric:last-child { border-bottom: 0; }

.metric.total {
  font-size: 18px;
  font-weight: 700;
}

.muted {
  color: #6b7280;
  font-size: 13px;
}

.good { color: #047857; }
.bad { color: #dc2626; }

details summary {
  list-style: none;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  cursor: pointer;
}

details summary::-webkit-details-marker { display: none; }

.budget-line {
  color: #6b7280;
  font-size: 13px;
  margin: 10px 0;
}

.sub-row {
  display: flex;
  justify-content: space-between;
  border-top: 1px solid #f1f1f1;
  padding: 8px 0;
}

.transaction {
  background: white;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}

.transaction-actions {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  justify-content: flex-end;
}

button, input, select {
  font: inherit;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 8px 10px;
  background: #e5e7eb;
}

button.primary {
  background: #111827;
  color: white;
  width: 100%;
  margin-top: 8px;
}

input, select {
  width: 100%;
  padding: 11px;
  margin: 6px 0;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  box-sizing: border-box;
  background: white;
}

.empty {
  color: #9ca3af;
  font-size: 13px;
  padding: 8px 0;
}

.pill {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  background: #fef3c7;
  color: #92400e;
}
</style>
</head>

<body>
<div id="app"></div>

<script>
const categoryModel = {
  "Mortgage": ["Home loan repayment"],
  "Household": ["AGL gas & electricity", "Water", "Rates", "Home insurance"],
  "Transport": ["Petrol", "Car insurance", "Car rego"],
  "Living": ["Groceries", "Chemist"],
  "Lifestyle": ["Coffee", "Takeaway", "Steve Lou entertainment"],
  "Kids": ["Kids swimming lessons", "Mila gymnastics", "Mila Acro", "Mila school fees", "Miscellaneous kids"],
  "Subscriptions": ["Netflix", "Amazon", "Spotify", "Stronglifts 5x5 app", "Doordash app subscription", "Hayu", "Disney", "HBO", "Apple storage", "Google storage", "MCC membership"],
  "Utilities / Personal": ["Phone and internet", "Gym"],
  "Buffer / Price Increases": ["General buffer", "Annual increases", "Unexpected bill movement"],
  "Needs Review": ["Needs Review", "ATM Withdrawal", "Unmapped Transaction"],
  "Income": ["Salary", "Bonus", "Other income"],
  "Investing / Savings": ["ETFs", "Super", "Savings"]
};

const budgets = {
  "Mortgage": 6600,
  "Household": 891,
  "Transport": 371,
  "Living": 1275,
  "Lifestyle": 1133,
  "Kids": 635,
  "Subscriptions": 91,
  "Utilities / Personal": 279,
  "Buffer / Price Increases": 150,
  "Investing / Savings": 0
};

const budgetStartDate = "2026-05-01";

let activeTab = "dashboard";
let transactions = JSON.parse(localStorage.getItem("transactions") || "[]");

function save() {
  localStorage.setItem("transactions", JSON.stringify(transactions));
  render();
}

function dollars(value) {
  return "$" + Number(value || 0).toFixed(2);
}

function normaliseText(text) {
  return String(text || "").toUpperCase().trim();
}

function parseDate(value) {
  if (!value) return "";
  const raw = String(value).trim();

  if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;

  const parts = raw.split(/[\/\-]/);
  if (parts.length === 3) {
    let [d, m, y] = parts;
    if (y.length === 2) y = "20" + y;
    return `${y.padStart(4, "0")}-${m.padStart(2, "0")}-${d.padStart(2, "0")}`;
  }

  return raw;
}

function isOnOrAfterBudgetStart(dateString) {
  return new Date(dateString) >= new Date(budgetStartDate);
}

function isThisMonth(dateString) {
  const d = new Date(dateString);
  const now = new Date();

  return (
    d.getMonth() === now.getMonth() &&
    d.getFullYear() === now.getFullYear() &&
    isOnOrAfterBudgetStart(dateString)
  );
}

function monthsElapsedSinceBudgetStart() {
  const start = new Date(budgetStartDate);
  const now = new Date();

  if (now < start) return 0;

  return (
    (now.getFullYear() - start.getFullYear()) * 12 +
    (now.getMonth() - start.getMonth()) +
    1
  );
}

function setTab(tab) {
  activeTab = tab;
  render();
}

function transactionCountsForBudget(t) {
  return t.type === "expense";
}

function transactionCountsForIncome(t) {
  return t.type === "income";
}

function getVisibleTransactions() {
  return transactions.filter(t => !t.hidden);
}

function getThisMonthTransactions() {
  return getVisibleTransactions().filter(t => isThisMonth(t.date));
}

function getTransactionsSinceBudgetStart() {
  return getVisibleTransactions().filter(t => isOnOrAfterBudgetStart(t.date));
}

function getAllVisibleTransactions() {
  return getVisibleTransactions()
    .slice()
    .sort((a, b) => new Date(b.date) - new Date(a.date));
}

function getNeedsReviewTransactions() {
  return getVisibleTransactions()
    .filter(t => t.type === "needs_review")
    .slice()
    .sort((a, b) => new Date(b.date) - new Date(a.date));
}

function getThisMonthParentTotals() {
  const totals = {};
  Object.keys(budgets).forEach(cat => totals[cat] = 0);

  getThisMonthTransactions().forEach(t => {
    if (transactionCountsForBudget(t) && totals[t.parent] !== undefined) {
      totals[t.parent] += Math.abs(t.amount);
    }
  });

  return totals;
}

function getAccrualParentTotals() {
  const totals = {};
  Object.keys(budgets).forEach(cat => totals[cat] = 0);

  getTransactionsSinceBudgetStart().forEach(t => {
    if (transactionCountsForBudget(t) && totals[t.parent] !== undefined) {
      totals[t.parent] += Math.abs(t.amount);
    }
  });

  return totals;
}

function getSubTotals(parent, mode = "month") {
  const totals = {};
  const txSource =
    mode === "accrual"
      ? getTransactionsSinceBudgetStart()
      : getThisMonthTransactions();

  txSource
    .filter(t => t.parent === parent && transactionCountsForBudget(t))
    .forEach(t => {
      totals[t.sub] = (totals[t.sub] || 0) + Math.abs(t.amount);
    });

  return totals;
}

function getMonthlySummary() {
  const monthTx = getThisMonthTransactions();

  const income = monthTx
    .filter(transactionCountsForIncome)
    .reduce((sum, t) => sum + Math.abs(t.amount), 0);

  const expenses = monthTx
    .filter(transactionCountsForBudget)
    .reduce((sum, t) => sum + Math.abs(t.amount), 0);

  return { income, expenses, surplus: income - expenses };
}

function getAccrualSummary() {
  const monthsElapsed = monthsElapsedSinceBudgetStart();
  const accrualTotals = getAccrualParentTotals();

  let totalBudgetAccrued = 0;
  let totalActualSpent = 0;

  Object.keys(budgets).forEach(parent => {
    totalBudgetAccrued += budgets[parent] * monthsElapsed;
    totalActualSpent += accrualTotals[parent] || 0;
  });

  return {
    monthsElapsed,
    totalBudgetAccrued,
    totalActualSpent,
    balance: totalBudgetAccrued - totalActualSpent
  };
}

function updateSubCategories(parentValue) {
  const subSelect = document.getElementById("sub");
  if (!subSelect) return;

  subSelect.innerHTML = categoryModel[parentValue]
    .map(sub => `<option value="${sub}">${sub}</option>`)
    .join("");
}

function addTransaction(e) {
  e.preventDefault();

  const form = e.target;
  const amount = parseFloat(form.amount.value);
  const parent = form.parent.value;

  let type = "expense";
  if (parent === "Income") type = "income";
  if (parent === "Needs Review") type = "needs_review";

  transactions.push({
    id: Date.now(),
    date: form.date.value,
    amount,
    type,
    parent,
    sub: form.sub.value,
    note: form.note.value,
    hidden: false,
    imported: false
  });

  save();
}

function deleteTransaction(id) {
  transactions = transactions.filter(t => t.id !== id);
  save();
}

function editTransaction(id) {
  const t = transactions.find(t => t.id === id);
  if (!t) return;

  const newAmount = prompt("Amount", t.amount);
  if (newAmount === null) return;

  const newParent = prompt("Parent category", t.parent);
  if (newParent === null) return;

  const validParent = categoryModel[newParent] ? newParent : "Needs Review";
  const validSubs = categoryModel[validParent];

  const newSub = prompt("Sub-category", t.sub);
  if (newSub === null) return;

  const newNote = prompt("Note / merchant", t.note || "");
  if (newNote === null) return;

  t.amount = parseFloat(newAmount);
  t.parent = validParent;
  t.sub = validSubs.includes(newSub) ? newSub : validSubs[0];
  t.note = newNote;
  t.hidden = false;

  if (t.parent === "Income") {
    t.type = "income";
  } else if (t.parent === "Needs Review") {
    t.type = "needs_review";
  } else {
    t.type = "expense";
  }

  save();
}

function parseCSV(text) {
  const rows = [];
  let current = "";
  let row = [];
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const next = text[i + 1];

    if (char === '"' && inQuotes && next === '"') {
      current += '"';
      i++;
    } else if (char === '"') {
      inQuotes = !inQuotes;
    } else if (char === "," && !inQuotes) {
      row.push(current.trim());
      current = "";
    } else if ((char === "\n" || char === "\r") && !inQuotes) {
      if (current || row.length) {
        row.push(current.trim());
        rows.push(row);
      }
      current = "";
      row = [];
      if (char === "\r" && next === "\n") i++;
    } else {
      current += char;
    }
  }

  if (current || row.length) {
    row.push(current.trim());
    rows.push(row);
  }

  return rows;
}

function classifyTransaction(description, amount) {
  const d = normaliseText(description);

  if (d.includes("ATM") || d.includes("CASH WITHDRAWAL")) {
    return { type: "needs_review", parent: "Needs Review", sub: "ATM Withdrawal", hidden: false };
  }

  if (d.includes("HOME LOAN PYMT") || d.includes("MORTGAGE")) {
    return { type: "expense", parent: "Mortgage", sub: "Home loan repayment", hidden: false };
  }

  if (
    d.includes("PAYMENT RECEIVED") ||
    d.includes("CREDIT CARD PAYMENT") ||
    d.includes("TRANSFER TO") ||
    d.includes("TRANSFER FROM") ||
    d.includes("NETBANK")
  ) {
    return { type: "ignored", parent: "Ignored", sub: "Internal Transfer", hidden: true };
  }

  if (
    d.includes("SALARY") ||
    d.includes("PAYROLL") ||
    d.includes("WAGES") ||
    d.includes("TELSTRA CORPORAT")
  ) {
    return { type: "income", parent: "Income", sub: "Salary", hidden: false };
  }

  const rules = [
    { keys: ["WAVERLEY GYMNASTICS"], parent: "Kids", sub: "Mila gymnastics" },
    { keys: ["DANNY FRAWLEY"], parent: "Kids", sub: "Kids swimming lessons" },
    { keys: ["REC XPRESS", "REC EXPRESS"], parent: "Utilities / Personal", sub: "Gym" },

    { keys: ["WOOLWORTHS", "COLES", "ALDI", "IGA"], parent: "Living", sub: "Groceries" },
    { keys: ["CHEMIST", "PHARMACY", "PRICELINE", "CWH"], parent: "Living", sub: "Chemist" },

    { keys: ["7-ELEVEN", "BP ", "SHELL", "AMPOL", "CALTEX", "UNITED PETROLEUM", "REDDY EXPRESS"], parent: "Transport", sub: "Petrol" },

    { keys: ["AGL"], parent: "Household", sub: "AGL gas & electricity" },
    { keys: ["SOUTH EAST WATER", "YARRA VALLEY WATER"], parent: "Household", sub: "Water" },
    { keys: ["COUNCIL", "RATES"], parent: "Household", sub: "Rates" },

    { keys: ["NETFLIX"], parent: "Subscriptions", sub: "Netflix" },
    { keys: ["SPOTIFY"], parent: "Subscriptions", sub: "Spotify" },
    { keys: ["APPLE"], parent: "Subscriptions", sub: "Apple storage" },
    { keys: ["GOOGLE"], parent: "Subscriptions", sub: "Google storage" },
    { keys: ["DISNEY"], parent: "Subscriptions", sub: "Disney" },
    { keys: ["HAYU"], parent: "Subscriptions", sub: "Hayu" },
    { keys: ["BINGE", "HBO", "MAX"], parent: "Subscriptions", sub: "HBO" },
    { keys: ["DOORDASH PASS"], parent: "Subscriptions", sub: "Doordash app subscription" },
    { keys: ["STRONGLIFTS"], parent: "Subscriptions", sub: "Stronglifts 5x5 app" },
    { keys: ["MCC"], parent: "Subscriptions", sub: "MCC membership" },

    { keys: ["TELSTRA", "OPTUS", "AUSSIE BROADBAND", "TPG", "NBN"], parent: "Utilities / Personal", sub: "Phone and internet" },
    { keys: ["ANYTIME FITNESS", "GENESIS", "FITNESS"], parent: "Utilities / Personal", sub: "Gym" },

    { keys: ["SWIM", "SWIMMING"], parent: "Kids", sub: "Kids swimming lessons" },
    { keys: ["GYMNASTICS"], parent: "Kids", sub: "Mila gymnastics" },
    { keys: ["ACRO"], parent: "Kids", sub: "Mila Acro" },
    { keys: ["SCHOOL"], parent: "Kids", sub: "Mila school fees" },

    { keys: ["CAFE", "COFFEE", "BAKERS DELIGHT"], parent: "Lifestyle", sub: "Coffee" },
    { keys: ["UBER EATS", "DOORDASH", "MENULOG", "MCDONALD", "KFC", "GRILLD", "PIZZA"], parent: "Lifestyle", sub: "Takeaway" },
    { keys: ["RSL", "BWS", "CINEMA", "TICKETEK", "TICKETMASTER", "RESTAURANT", "BAR"], parent: "Lifestyle", sub: "Steve Lou entertainment" }
  ];

  for (const rule of rules) {
    if (rule.keys.some(k => d.includes(k))) {
      return { type: "expense", parent: rule.parent, sub: rule.sub, hidden: false };
    }
  }

  if (amount > 0) {
    return { type: "income", parent: "Income", sub: "Other income", hidden: false };
  }

  return { type: "needs_review", parent: "Needs Review", sub: "Unmapped Transaction", hidden: false };
}

function makeFingerprint(tx) {
  return [tx.date, Number(tx.amount).toFixed(2), normaliseText(tx.note)].join("|");
}

function findColumn(headers, candidates) {
  const normalised = headers.map(h => normaliseText(h));

  for (const candidate of candidates) {
    const index = normalised.findIndex(h => h.includes(candidate));
    if (index !== -1) return index;
  }

  return -1;
}

function importCSVFile(file) {
  const reader = new FileReader();

  reader.onload = function(evt) {
    const rows = parseCSV(evt.target.result).filter(r => r.length > 1);

    if (rows.length < 2) {
      alert("No transactions found.");
      return;
    }

    const headers = rows[0];

    const dateIndex = findColumn(headers, ["DATE"]);
    const descIndex = findColumn(headers, ["DESCRIPTION", "TRANSACTION", "DETAILS", "NARRATIVE"]);
    const amountIndex = findColumn(headers, ["AMOUNT"]);

    if (dateIndex === -1 || descIndex === -1 || amountIndex === -1) {
      alert("Could not identify Date, Description and Amount columns.");
      return;
    }

    const existing = new Set(transactions.map(makeFingerprint));

    let imported = 0;
    let skipped = 0;
    let ignored = 0;
    let needsReview = 0;

    rows.slice(1).forEach(row => {
      const date = parseDate(row[dateIndex]);
      const note = row[descIndex];
      const amount = parseFloat(String(row[amountIndex]).replace(/[$,]/g, ""));

      if (!date || !note || isNaN(amount)) return;

      const classification = classifyTransaction(note, amount);

      const tx = {
        id: Date.now() + Math.random(),
        date,
        amount,
        type: classification.type,
        parent: classification.parent,
        sub: classification.sub,
        note,
        hidden: classification.hidden,
        imported: true
      };

      const fingerprint = makeFingerprint(tx);

      if (existing.has(fingerprint)) {
        skipped++;
        return;
      }

      existing.add(fingerprint);
      transactions.push(tx);
      imported++;

      if (tx.hidden) ignored++;
      if (tx.type === "needs_review") needsReview++;
    });

    save();

    alert(`Import complete. Imported ${imported}. Skipped duplicates ${skipped}. Hidden transfers ${ignored}. Needs review ${needsReview}.`);
  };

  reader.readAsText(file);
}

function handleCSVUpload(e) {
  const files = Array.from(e.target.files || []);
  files.forEach(importCSVFile);
  e.target.value = "";
}

function renderDashboard() {
  const monthlySummary = getMonthlySummary();
  const accrualSummary = getAccrualSummary();
  const monthlyParentTotals = getThisMonthParentTotals();
  const accrualParentTotals = getAccrualParentTotals();
  const monthsElapsed = monthsElapsedSinceBudgetStart();

  const accrualRows = Object.keys(budgets).map(parent => {
    const monthlyBudget = budgets[parent];
    const accrued = monthlyBudget * monthsElapsed;
    const actual = accrualParentTotals[parent] || 0;
    const balance = accrued - actual;
    const subTotals = getSubTotals(parent, "accrual");

    const subBreakdown = Object.keys(subTotals).length
      ? Object.entries(subTotals).sort((a, b) => b[1] - a[1]).map(([sub, amount]) => `
        <div class="sub-row"><span>${sub}</span><strong>${dollars(amount)}</strong></div>
      `).join("")
      : `<div class="empty">No spend since budget start</div>`;

    return `
      <details class="card">
        <summary>
          <div>
            <strong>${parent}</strong>
            <div class="muted">Accrued ${dollars(accrued)} · Spent ${dollars(actual)}</div>
          </div>
          <div class="${balance >= 0 ? "good" : "bad"}">
            ${balance >= 0 ? dollars(balance) + " ahead" : dollars(Math.abs(balance)) + " behind"}
          </div>
        </summary>
        <div class="budget-line">Monthly accrual: ${dollars(monthlyBudget)} · Months elapsed: ${monthsElapsed}</div>
        <div>${subBreakdown}</div>
      </details>
    `;
  }).join("");

  const monthlyRows = Object.keys(budgets).map(parent => {
    const budget = budgets[parent];
    const actual = monthlyParentTotals[parent] || 0;
    const variance = budget - actual;

    return `
      <div class="card">
        <div class="metric">
          <span><strong>${parent}</strong></span>
          <span class="${variance >= 0 ? "good" : "bad"}">
            ${variance >= 0 ? dollars(variance) + " left" : dollars(Math.abs(variance)) + " over"}
          </span>
        </div>
        <div class="muted">Budget ${dollars(budget)} · Actual ${dollars(actual)}</div>
      </div>
    `;
  }).join("");

  return `
    <section class="summary">
      <h2>This Month Cash View</h2>
      <div class="metric"><span>Income</span><strong>${dollars(monthlySummary.income)}</strong></div>
      <div class="metric"><span>Expenses</span><strong>${dollars(monthlySummary.expenses)}</strong></div>
      <div class="metric total"><span>Cash surplus this month</span><strong>${dollars(monthlySummary.surplus)}</strong></div>
      <p class="muted">Dashboard only includes transactions from ${budgetStartDate} onward.</p>
    </section>

    <section class="summary">
      <h2>Category Balance</h2>
      <p class="muted">Accrual view from ${budgetStartDate}. This smooths annual, quarterly and uneven bills.</p>
      <div class="metric"><span>Budget accrued</span><strong>${dollars(accrualSummary.totalBudgetAccrued)}</strong></div>
      <div class="metric"><span>Actual spent</span><strong>${dollars(accrualSummary.totalActualSpent)}</strong></div>
      <div class="metric total">
        <span>Overall balance</span>
        <strong class="${accrualSummary.balance >= 0 ? "good" : "bad"}">
          ${accrualSummary.balance >= 0 ? dollars(accrualSummary.balance) + " ahead" : dollars(Math.abs(accrualSummary.balance)) + " behind"}
        </strong>
      </div>
    </section>

    <section>
      <h2>Accrual Balance by Category</h2>
      ${accrualRows}
    </section>

    <section>
      <h2>This Month vs Budget</h2>
      ${monthlyRows}
    </section>
  `;
}

function renderTransactionHistory() {
  const parentOptions = Object.keys(categoryModel)
    .map(parent => `<option value="${parent}">${parent}</option>`)
    .join("");

  const needsReview = getNeedsReviewTransactions();
  const allTransactions = getAllVisibleTransactions();

  const renderList = list => list.length
    ? list.map(t => `
      <div class="transaction">
        <div>
          <strong>${t.sub}</strong>
          <div class="muted">${t.parent} · ${t.date}${t.note ? " · " + t.note : ""}</div>
          ${t.type === "needs_review" ? `<span class="pill">Needs review</span>` : ""}
        </div>
        <div>
          <strong>${t.amount < 0 ? "-" : "+"}${dollars(Math.abs(t.amount))}</strong>
          <div class="transaction-actions">
            <button onclick="editTransaction(${t.id})">Edit</button>
            <button onclick="deleteTransaction(${t.id})">Delete</button>
          </div>
        </div>
      </div>
    `).join("")
    : `<p class="muted">No transactions to show.</p>`;

  return `
    <section class="panel">
      <h2>Import CSV</h2>
      <p class="muted">Import CBA CSVs. Transfers and credit card repayments are hidden. ATM withdrawals and unmapped items go to Needs Review.</p>
      <input type="file" accept=".csv" multiple onchange="handleCSVUpload(event)" />
    </section>

    <section class="panel">
      <h2>Add Transaction</h2>
      <form onsubmit="addTransaction(event)">
        <input type="date" name="date" required />
        <input type="number" step="0.01" name="amount" placeholder="Amount (+ income / - expense)" required />

        <select name="parent" id="parent" onchange="updateSubCategories(this.value)" required>
          ${parentOptions}
        </select>

        <select name="sub" id="sub" required></select>

        <input type="text" name="note" placeholder="Note / merchant" />
        <button class="primary">Add Transaction</button>
      </form>
    </section>

    <section>
      <h2>Needs Review</h2>
      ${renderList(needsReview)}
    </section>

    <section>
      <h2>All Visible Transactions</h2>
      <p class="muted">Hidden transfers and credit card repayments do not appear here.</p>
      ${renderList(allTransactions)}
    </section>
  `;
}

function render() {
  document.getElementById("app").innerHTML = `
    <main>
      <h1>Goodman Finances Inc.</h1>

      <div class="tabs">
        <button class="${activeTab === "dashboard" ? "active" : ""}" onclick="setTab('dashboard')">Dashboard</button>
        <button class="${activeTab === "transactions" ? "active" : ""}" onclick="setTab('transactions')">Transaction History</button>
      </div>

      ${activeTab === "dashboard" ? renderDashboard() : renderTransactionHistory()}
    </main>
  `;

  if (activeTab === "transactions") {
    const parentEl = document.getElementById("parent");
    if (parentEl) updateSubCategories(parentEl.value);
  }
}

render();
</script>
</body>
</html>
