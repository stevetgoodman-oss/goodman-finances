<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goodman Finances Inc.</title>
<style>
body { font-family: -apple-system; padding: 16px; background:#f5f5f5;}
h1,h2 { margin-bottom:8px;}
.card { background:white; padding:12px; margin-bottom:10px; border-radius:8px;}
button { margin-top:6px;}
select,input { width:100%; padding:8px; margin:4px 0;}
.transaction { display:flex; justify-content:space-between; border-bottom:1px solid #eee; padding:6px 0;}
.good { color:green;}
.bad { color:red;}
</style>
</head>

<body>

<h1>Goodman Finances Inc.</h1>

<button onclick="importCSV()">Import CSV</button>
<input type="file" id="csvFile" style="display:none" />

<h2>Add Transaction</h2>

<input type="date" id="date">
<input type="number" id="amount" placeholder="Amount (+ income / - expense)">

<select id="account">
<option>Direct Debit</option>
<option>Household</option>
<option>Credit Card</option>
</select>

<select id="parent"></select>
<select id="sub"></select>

<input type="text" id="note" placeholder="Note">

<button onclick="addTransaction()">Add</button>

<h2>This Month</h2>
<div id="summary"></div>

<h2>Transactions</h2>
<div id="transactions"></div>

<script>

const categoryModel = {
"Household": ["AGL","Water","Rates","Home insurance"],
"Transport": ["Petrol","Car insurance","Car rego"],
"Living": ["Groceries","Chemist"],
"Lifestyle": ["Coffee","Takeaway","Entertainment"],
"Kids": ["Swimming","Gymnastics","Acro","School","Kids misc"],
"Subscriptions": ["Netflix","Spotify","Apple","Google","Disney"],
"Utilities": ["Phone","Gym"],
"Buffer": ["General"]
};

const budgets = {
"Household": 891,
"Transport": 371,
"Living": 1275,
"Lifestyle": 1133,
"Kids": 635,
"Subscriptions": 91,
"Utilities": 279,
"Buffer": 150
};

let transactions = JSON.parse(localStorage.getItem("transactions") || "[]");

function save(){
localStorage.setItem("transactions", JSON.stringify(transactions));
render();
}

function addTransaction(){
transactions.push({
id: Date.now(),
date: document.getElementById("date").value,
amount: parseFloat(document.getElementById("amount").value),
account: document.getElementById("account").value,
parent: document.getElementById("parent").value,
sub: document.getElementById("sub").value,
note: document.getElementById("note").value
});
save();
}

function deleteTx(id){
transactions = transactions.filter(t=>t.id!==id);
save();
}

function editTx(id){
const t = transactions.find(t=>t.id===id);
const newAmount = prompt("Edit amount", t.amount);
if(newAmount!==null){
t.amount = parseFloat(newAmount);
save();
}
}

function render(){

const now = new Date();

const monthTx = transactions.filter(t=>{
const d = new Date(t.date);
return d.getMonth()===now.getMonth();
});

const income = monthTx.filter(t=>t.amount>0).reduce((a,b)=>a+b.amount,0);
const expenses = monthTx.filter(t=>t.amount<0 && t.type!=="transfer").reduce((a,b)=>a+Math.abs(b.amount),0);

document.getElementById("summary").innerHTML = `
<div class="card">
Income: $${income.toFixed(2)}<br>
Expenses: $${expenses.toFixed(2)}<br>
<b>Surplus: $${(income-expenses).toFixed(2)}</b>
</div>
`;

document.getElementById("transactions").innerHTML = monthTx.map(t=>`
<div class="transaction">
<div>${t.sub}<br><small>${t.note}</small></div>
<div>
$${t.amount}
<br>
<button onclick="editTx(${t.id})">✏️</button>
<button onclick="deleteTx(${t.id})">🗑</button>
</div>
</div>
`).join("");
}

function populateDropdowns(){
const parentSelect = document.getElementById("parent");
parentSelect.innerHTML = Object.keys(categoryModel).map(p=>`<option>${p}</option>`).join("");

updateSub();

parentSelect.onchange = updateSub;
}

function updateSub(){
const parent = document.getElementById("parent").value;
document.getElementById("sub").innerHTML = categoryModel[parent].map(s=>`<option>${s}</option>`).join("");
}

function importCSV(){
document.getElementById("csvFile").click();
}

document.getElementById("csvFile").addEventListener("change", function(e){
const file = e.target.files[0];
const reader = new FileReader();

reader.onload = function(evt){
const rows = evt.target.result.split("\n");

rows.slice(1).forEach(row=>{
const cols = row.split(",");

if(cols.length<3) return;

const description = cols[1].toUpperCase();
const amount = parseFloat(cols[2]);

let parent="Needs Review";
let sub="Needs Review";
let type="expense";

if(description.includes("TRANSFER")) type="transfer";
if(description.includes("PAYMENT")) type="transfer";
if(description.includes("SALARY")) type="income";

if(description.includes("WOOLWORTHS") || description.includes("COLES")){
parent="Living"; sub="Groceries";
}
if(description.includes("7-ELEVEN") || description.includes("BP")){
parent="Transport"; sub="Petrol";
}
if(description.includes("NETFLIX")){
parent="Subscriptions"; sub="Netflix";
}

if(type==="transfer") return;

transactions.push({
id: Date.now()+Math.random(),
date: cols[0],
amount: amount,
parent,
sub,
note: cols[1]
});
});

save();
};

reader.readAsText(file);
});

populateDropdowns();
render();

</script>

</body>
</html>
