*/
const SUPABASE_URL = "https://lfqumpuhmirkahjexwyk.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmcXVtcHVobWlya2FoamV4d3lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0MDIzOTYsImV4cCI6MjA5Mjk3ODM5Nn0.4zhe2_tsS7Hgp31flXxHZ7f4SGbU653HVYftq6TRw5E";

const defaultObligations = [
  {

let wealth = JSON.parse(localStorage.getItem("wealth") || JSON.stringify(defaultWealth));

wealth = {

};

function isSupabaseConfigured() {
  return (
    SUPABASE_URL &&
    SUPABASE_ANON_KEY &&
    !SUPABASE_ANON_KEY.includes("PASTE_YOUR_ANON")
  );
}

function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();

  return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c =>
    (+c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> +c / 4).toString(16)
  );
}

function isUuid(value) {
  return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(value || ""));
}

function ensureTransactionIds() {
  transactions.forEach(t => {
    if (!isUuid(t.id)) t.id = uuid();
  });
}

function transactionDbRow(t) {
  return {
    id: t.id,
    date: t.date,
    amount: Number(t.amount || 0),
    parent: t.parent || "",
    sub: t.sub || "",
    note: t.note || "",
    type: t.type || "expense",
    hidden: !!t.hidden
  };
}

async function supabaseFetch(path, options = {}) {
  if (!isSupabaseConfigured()) return null;

  const response = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });

  if (!response.ok) {
    const text = await response.text();
    throw new Error(text || `Supabase request failed: ${response.status}`);
  }

  if (response.status === 204) return null;

  const body = await response.text();
  return body ? JSON.parse(body) : null;
}

function dbObligationRow(o) {
  return {
    id: isUuid(o.id) ? o.id : undefined,
    name: o.name,
    amount: Number(o.amount || 0),
    frequency: o.frequency,
    next_due_date: o.next_due_date,
    parent_category: o.parent_category,
    sub_category: o.sub_category,
    active: !!o.active
  };
}

function dbMappingRow(m) {
  return {
    id: isUuid(m.id) ? m.id : undefined,
    pattern: normaliseText(m.pattern),
    parent_category: m.parent_category,
    sub_category: m.sub_category,
    active: !!m.active
  };
}

async function fetchConfigTables() {
  if (!isSupabaseConfigured()) return;

  const obligationRows = await supabaseFetch("scheduled_obligations?select=*&order=next_due_date.asc");
  obligations = (obligationRows || []).map(row => ({
    id: row.id,
    name: row.name,
    amount: Number(row.amount || 0),
    frequency: row.frequency,
    next_due_date: row.next_due_date,
    parent_category: row.parent_category,
    sub_category: row.sub_category,
    active: !!row.active
  }));

  if (!obligations.length) {
    obligations = defaultObligations.map(o => ({ ...o, id: uuid() }));
    await syncObligationsToSupabase();
  }

  const mappingRows = await supabaseFetch("transaction_mappings?select=*&order=created_at.asc");
  mappings = (mappingRows || []).map(row => ({
    id: row.id,
    pattern: row.pattern,
    parent_category: row.parent_category,
    sub_category: row.sub_category,
    active: !!row.active
  }));
}

async function syncObligationsToSupabase() {
  localStorage.setItem("obligations", JSON.stringify(obligations));

  if (!isSupabaseConfigured()) return;

  const rows = obligations.map(dbObligationRow).map(row => {
    if (!row.id) row.id = uuid();
    return row;
  });

  if (rows.length) {
    await supabaseFetch("scheduled_obligations?on_conflict=id", {
      method: "POST",
      headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify(rows)
    });
  }
}


async function fetchCustomSubcategories() {
  if (!isSupabaseConfigured()) {
    customSubcategories = JSON.parse(localStorage.getItem("custom_subcategories") || "[]");
    return;
  }

  const rows = await supabaseFetch("custom_subcategories?select=*&order=parent_category.asc");
  customSubcategories = (rows || []).map(row => ({
    id: row.id,
    parent_category: row.parent_category,
    sub_category: row.sub_category,
    active: !!row.active
  }));
}

async function syncCustomSubcategoriesToSupabase() {
  localStorage.setItem("custom_subcategories", JSON.stringify(customSubcategories));

  if (!isSupabaseConfigured()) return;

  const rows = customSubcategories.map(row => ({
    id: row.id || uuid(),
    parent_category: row.parent_category,
    sub_category: row.sub_category,
    active: row.active !== false
  }));

  if (rows.length) {
    await supabaseFetch("custom_subcategories?on_conflict=id", {
      method: "POST",
      headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify(rows)
    });
  }
}

async function ensureCustomSubcategory(parent, subcategory) {
  const existsInBase = (categoryModel[parent] || []).includes(subcategory);

  const existsCustom = customSubcategories.some(
    item =>
      item.active !== false &&
      item.parent_category === parent &&
      normaliseText(item.sub_category) === normaliseText(subcategory)
  );

  if (!existsInBase && !existsCustom) {
    customSubcategories.push({
      id: uuid(),
      parent_category: parent,

async function loadSharedData() {
  appLoading = true;
  appError = "";
  render();

  try {
    if (!isSupabaseConfigured()) {
      transactions = JSON.parse(localStorage.getItem("transactions") || "[]");
      obligations = JSON.parse(localStorage.getItem("obligations") || JSON.stringify(defaultObligations));
      mappings = JSON.parse(localStorage.getItem("transaction_mappings") || "[]");
      wealth = JSON.parse(localStorage.getItem("wealth") || JSON.stringify(defaultWealth));
      wealth = {
        ...defaultWealth,
        ...wealth,
        baseline: { ...defaultWealth.baseline, ...(wealth.baseline || {}) },
        current: { ...defaultWealth.current, ...(wealth.current || {}) }
      };
      appLoading = false;
      render();
      return;
    }

    await fetchConfigTables();
    await fetchCustomSubcategories();

    const txRows = await supabaseFetch("transactions?select=*&order=date.desc");
    transactions = (txRows || []).map(row => ({
      id: row.id,
      date: row.date,
      amount: Number(row.amount || 0),
      parent: row.parent,
      sub: row.sub,
      note: row.note,
      type: row.type,
      hidden: !!row.hidden
    }));

    const wealthRows = await supabaseFetch("wealth?select=*&id=eq.1");

    if (wealthRows && wealthRows.length && wealthRows[0].data) {
      wealth = wealthRows[0].data;
    } else {
      wealth = JSON.parse(localStorage.getItem("wealth") || JSON.stringify(defaultWealth));
      await syncWealthToSupabase();
    }

    wealth = {
      ...defaultWealth,
      ...wealth,
      baseline: { ...defaultWealth.baseline, ...(wealth.baseline || {}) },
      current: { ...defaultWealth.current, ...(wealth.current || {}) }
    };

    localStorage.setItem("transactions", JSON.stringify(transactions));
    localStorage.setItem("wealth", JSON.stringify(wealth));

    appLoading = false;
    render();
  } catch (error) {
    console.error(error);
    appError = "Could not load shared data. Check your Supabase tables, keys and policies.";
    appLoading = false;
    render();
  }
}

async function save() {
  ensureTransactionIds();
  localStorage.setItem("transactions", JSON.stringify(transactions));
  render();

  try {
    await syncTransactionsToSupabase();
  } catch (error) {
    console.error(error);
    alert("Could not sync transactions to Supabase. Your browser copy is still saved locally.");
  }

function dollars(value, decimals = 0) {
  return "$" + Number(value || 0).toLocaleString("en-AU", {
    minimumFractionDigits: decimals,
    maximumFractionDigits: decimals
  });
}

function dollarsExact(value) {
  return "$" + Number(value || 0).toLocaleString("en-AU", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function normaliseText(text) {
  return String(text || "").toUpperCase().trim();
}

function parseDate(value) {
  if (!value) return "";
  const raw = String(value).trim();

  if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;

  const parts = raw.split(/[\/\-]/);
  if (parts.length === 3) {
    let [d, m, y] = parts;
    if (y.length === 2) y = "20" + y;
    return `${y.padStart(4, "0")}-${m.padStart(2, "0")}-${d.padStart(2, "0")}`;
  }

  return raw;
}

function isOnOrAfterBudgetStart(dateString) {
  return new Date(dateString) >= new Date(budgetStartDate);
}

function isThisMonth(dateString) {
  const d = new Date(dateString);
  const now = new Date();

  return (
    d.getMonth() === now.getMonth() &&
    d.getFullYear() === now.getFullYear() &&
    isOnOrAfterBudgetStart(dateString)
  );
}

function monthsElapsedSinceBudgetStart() {
  const start = new Date(budgetStartDate);
  const now = new Date();

  if (now < start) return 0;

  return (
    (now.getFullYear() - start.getFullYear()) * 12 +
    (now.getMonth() - start.getMonth()) +
    1
  );
}

function transactionCountsForBudget(t) {
  return t.type === "expense";
}

function transactionCountsForIncome(t) {
  return t.type === "income";
}

function expenseValue(t) {
  // Purchases are usually negative. Refunds/returns are positive and should reduce actual spend.
  if (t.amount < 0) return Math.abs(t.amount);
  return -Math.abs(t.amount);
}

function getVisibleTransactions() {
  return transactions.filter(t => !t.hidden);
}

function getThisMonthTransactions() {
  return getVisibleTransactions().filter(t => isThisMonth(t.date));
}

function getTransactionsSinceBudgetStart() {
  return getVisibleTransactions().filter(t => isOnOrAfterBudgetStart(t.date));
}

function getAllVisibleTransactions() {
  return getVisibleTransactions()
    .slice()
    .sort((a, b) => new Date(b.date) - new Date(a.date));
}

function getNeedsReviewTransactions() {
  return getVisibleTransactions()
    .filter(t => t.type === "needs_review")
    .slice()
    .sort((a, b) => new Date(b.date) - new Date(a.date));
}

function getThisMonthParentTotals() {
  const totals = {};
  Object.keys(budgets).forEach(cat => totals[cat] = 0);

  getThisMonthTransactions().forEach(t => {
    if (transactionCountsForBudget(t) && totals[t.parent] !== undefined) {
      totals[t.parent] += expenseValue(t);
    }
  });

  return totals;
}

function getAccrualParentTotals() {
  const totals = {};
  Object.keys(budgets).forEach(cat => totals[cat] = 0);

  getTransactionsSinceBudgetStart().forEach(t => {
    if (transactionCountsForBudget(t) && totals[t.parent] !== undefined) {
      totals[t.parent] += expenseValue(t);
    }
  });

  return totals;
}

function getSubTotals(parent, mode = "month") {
  const totals = {};
  const txSource =
    mode === "accrual"
      ? getTransactionsSinceBudgetStart()
      : getThisMonthTransactions();

  txSource
    .filter(t => t.parent === parent && transactionCountsForBudget(t))
    .forEach(t => {
      totals[t.sub] = (totals[t.sub] || 0) + expenseValue(t);
    });

  return totals;
}

function getMonthlySummary() {
  const monthTx = getThisMonthTransactions();

  const income = monthTx
    .filter(transactionCountsForIncome)
    .reduce((sum, t) => sum + Math.abs(t.amount), 0);

  const expenses = monthTx
    .filter(transactionCountsForBudget)
    .reduce((sum, t) => sum + expenseValue(t), 0);

  return { income, expenses, surplus: income - expenses };
}

function getAccrualSummary() {
  const monthsElapsed = monthsElapsedSinceBudgetStart();
  const accrualTotals = getAccrualParentTotals();

  let totalBudgetAccrued = 0;
  let totalActualSpent = 0;

  Object.keys(budgets).forEach(parent => {
    totalBudgetAccrued += budgets[parent] * monthsElapsed;
    totalActualSpent += accrualTotals[parent] || 0;
  });

  return {
    monthsElapsed,
    totalBudgetAccrued,
    totalActualSpent,
    balance: totalBudgetAccrued - totalActualSpent
  };
}

function getCategoryStatus(actual, budget, parent) {
  if (budget === 0) return { label: "Tracking", cls: "status-good", fill: "progress-fill", pct: 0 };

  const pct = actual / budget;
  const cappedPct = Math.min(pct * 100, 100);

  if (isTargetCategory(parent)) {
    if (pct >= 1) return { label: "Target met", cls: "status-good", fill: "progress-fill", pct: cappedPct };
    if (pct >= 0.8) return { label: "Close", cls: "status-watch", fill: "progress-fill watch", pct: cappedPct };
    return { label: "Behind target", cls: "status-bad", fill: "progress-fill bad", pct: cappedPct };
  }

  if (pct > 1) return { label: "Over", cls: "status-bad", fill: "progress-fill bad", pct: cappedPct };
  if (pct >= 0.8) return { label: "Watch", cls: "status-watch", fill: "progress-fill watch", pct: cappedPct };
  return { label: "Healthy", cls: "status-good", fill: "progress-fill", pct: cappedPct };
}

function getCategoryResultText(parent, actual, budget, mode) {
  const difference = budget - actual;

  if (isTargetCategory(parent)) {
    if (difference <= 0) return dollars(Math.abs(difference)) + " over target";
    return dollars(difference) + " short of target";
  }

  if (mode === "monthly") {
    if (difference >= 0) return dollars(difference) + " remaining";
    return dollars(Math.abs(difference)) + " over";
  }

  if (difference >= 0) return dollars(difference) + " ahead";
  return dollars(Math.abs(difference)) + " behind";
}

function getCategoryResultClass(parent, actual, budget) {
  const difference = budget - actual;

  if (isTargetCategory(parent)) {
    return difference <= 0 ? "good" : "bad";
  }

  return difference >= 0 ? "good" : "bad";
}

function parseCSV(text) {
  const rows = [];
  let current = "";
  let row = [];
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const next = text[i + 1];

    if (char === '"' && inQuotes && next === '"') {
      current += '"';
      i++;
    } else if (char === '"') {
      inQuotes = !inQuotes;
    } else if (char === "," && !inQuotes) {
      row.push(current.trim());
      current = "";
    } else if ((char === "\n" || char === "\r") && !inQuotes) {
      if (current || row.length) {
        row.push(current.trim());
        rows.push(row);
      }
      current = "";
      row = [];
      if (char === "\r" && next === "\n") i++;
    } else {
      current += char;
    }
  }

  if (current || row.length) {
    row.push(current.trim());
    rows.push(row);
  }

  return rows;
}

  const d = normaliseText(description);

  if (d.includes("ATM") || d.includes("CASH WITHDRAWAL")) {

    d.includes("TELSTRA CORPORAT") ||

    { keys: ["APPLE.COM/BILL MN412JXL", "APPLE.COM/BILL MN411GV", "APPLE.COM/BILL SYDNEY NS"], parent: "Subscriptions", sub: "HBO & Simply Draw" },
    { keys: ["APPLE.COM/BILL", "APPLE APPLE.COM/BILL"], parent: "Subscriptions", sub: "Apple storage" },
    { keys: ["GOOGLE STORAGE"], parent: "Subscriptions", sub: "Google storage" },
    { keys: ["BINGE", "HBO", "MAX"], parent: "Subscriptions", sub: "HBO" }
  ];

  for (const rule of rules) {
    if (rule.keys.some(k => d.includes(k))) {
      return { type: "expense", parent: rule.parent, sub: rule.sub, hidden: false };
    }
  }

  if (amount > 0) {
    return { type: "income", parent: "Income", sub: "Other income", hidden: false };
  }

  return { type: "needs_review", parent: "Needs Review", sub: "Unmapped Transaction", hidden: false };
}
function makeFingerprint(tx) {
  return [tx.date, Number(tx.amount).toFixed(2), normaliseText(tx.note)].join("|");
}

function findColumn(headers, candidates) {
  const normalised = headers.map(h => normaliseText(h));

  for (const candidate of candidates) {
    const index = normalised.findIndex(h => h.includes(candidate));
    if (index !== -1) return index;
  }

  return -1;
}

function importCSVFile(file) {
  const reader = new FileReader();

  reader.onload = function(evt) {
    const rows = parseCSV(evt.target.result).filter(r => r.length > 1);

    if (rows.length < 2) {
      alert("No transactions found.");
      return;
    }

    const headers = rows[0];

    const dateIndex = findColumn(headers, ["DATE"]);
    const descIndex = findColumn(headers, ["DESCRIPTION", "TRANSACTION", "DETAILS", "NARRATIVE"]);
    const amountIndex = findColumn(headers, ["AMOUNT"]);

    if (dateIndex === -1 || descIndex === -1 || amountIndex === -1) {
      alert("Could not identify Date, Description and Amount columns.");
      return;
    }

    const existing = new Set(transactions.map(makeFingerprint));

    let imported = 0;
    let skipped = 0;
    let ignored = 0;
    let needsReview = 0;

    rows.slice(1).forEach(row => {
      const date = parseDate(row[dateIndex]);
      const note = row[descIndex];
      const amount = parseFloat(String(row[amountIndex]).replace(/[$,]/g, ""));

      if (!date || !note || isNaN(amount)) return;

      const classification = classifyTransaction(note, amount);

      const tx = {
        id: uuid(),
        date,
        amount,
        type: classification.type,
        parent: classification.parent,
        sub: classification.sub,
        note,
        hidden: classification.hidden,
        imported: true
      };

      const fingerprint = makeFingerprint(tx);

      if (existing.has(fingerprint)) {
        skipped++;
        return;
      }

      existing.add(fingerprint);
      transactions.push(tx);
      imported++;

      if (tx.hidden) ignored++;
      if (tx.type === "needs_review") needsReview++;
    });

    save();

    alert(`Import complete. Imported ${imported}. Skipped duplicates ${skipped}. Hidden transfers ${ignored}. Needs review ${needsReview}.`);
  };

  reader.readAsText(file);
}

function handleCSVUpload(e) {
  const files = Array.from(e.target.files || []);
  files.forEach(importCSVFile);
  e.target.value = "";
}

function toNumber(value) {
  const n = parseFloat(String(value || "0").replace(/[$,]/g, ""));
  return isNaN(n) ? 0 : n;
}

function getWealthTotals(snapshot) {
  const superTotal = toNumber(snapshot.superSteve) + toNumber(snapshot.superLou);
  const etfTotal = toNumber(snapshot.etfVgs) + toNumber(snapshot.etfVas);
  const assets =
    toNumber(snapshot.property) +
    superTotal +
    etfTotal +
    toNumber(snapshot.cash);

  const netWealth = assets - toNumber(snapshot.mortgage);
  const liquidity = toNumber(snapshot.cash) + toNumber(snapshot.redraw);

  return {
    superTotal,
    etfTotal,
    assets,
    netWealth,
    liquidity
  };
}

function getWealthSummary() {
  const baseline = getWealthTotals(wealth.baseline);
  const current = getWealthTotals(wealth.current);

  const netDelta = current.netWealth - baseline.netWealth;
  const netDeltaPct = baseline.netWealth ? (netDelta / baseline.netWealth) * 100 : 0;

  return { baseline, current, netDelta, netDeltaPct };
}

function movementLabel(current, baseline, invert = false) {
  const delta = current - baseline;
  if (delta === 0) return "No movement";

  if (invert) {
    return delta < 0 ? "Improved" : "Increased";
  }

  return delta > 0 ? "Increased" : "Decreased";
}

function deltaText(current, baseline, invert = false) {
  const delta = current - baseline;
  const pct = baseline ? (delta / baseline) * 100 : 0;
  const sign = delta >= 0 ? "+" : "-";
  const absText = dollars(Math.abs(delta));
  const pctText = Math.abs(pct).toFixed(1) + "%";

  const displayDelta = `${sign}${absText} (${sign}${pctText})`;
  return displayDelta;
}

function deltaClass(current, baseline, invert = false) {
  const delta = current - baseline;
  if (delta === 0) return "";
  if (invert) return delta < 0 ? "good" : "bad";
  return delta > 0 ? "good" : "bad";
}

function parseLocalISODate(dateString) {
  const [year, month, day] = String(dateString).split("-").map(Number);
  return new Date(year, month - 1, day);
}

function toISODateLocal(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function addDays(date, days) {
  const d = new Date(date);
  d.setDate(d.getDate() + days);
  return d;
}

function addMonths(date, months) {
  const d = new Date(date);
  const targetDay = d.getDate();
  d.setMonth(d.getMonth() + months);

  if (d.getDate() !== targetDay) {
    d.setDate(0);
  }

  return d;
}

function getNextOccurrenceDate(date, frequency) {
  const f = String(frequency || "").toLowerCase();

  if (f === "weekly") return addDays(date, 7);
  if (f === "fortnightly") return addDays(date, 14);
  if (f === "monthly") return addMonths(date, 1);
  if (f === "quarterly") return addMonths(date, 3);
  if (f === "annually") return addMonths(date, 12);

  return addMonths(date, 1);
}

function isSameMonthAndYear(dateA, dateB) {
  return dateA.getFullYear() === dateB.getFullYear() &&
    dateA.getMonth() === dateB.getMonth();
}

function getActiveObligations() {
  return obligations.filter(o => o.active !== false);
}

function expandObligationOccurrences(startDate, endDate) {
  const occurrences = [];

  getActiveObligations().forEach(obligation => {
    let occurrenceDate = parseLocalISODate(obligation.next_due_date);
    let guard = 0;

    while (occurrenceDate < startDate && guard < 200) {
      occurrenceDate = getNextOccurrenceDate(occurrenceDate, obligation.frequency);
      guard++;
    }

    while (occurrenceDate <= endDate && guard < 300) {
      occurrences.push({
        ...obligation,
        occurrence_date: toISODateLocal(occurrenceDate),
        occurrenceDate
      });

      occurrenceDate = getNextOccurrenceDate(occurrenceDate, obligation.frequency);
      guard++;
    }
  });

  return occurrences.sort((a, b) => a.occurrenceDate - b.occurrenceDate);
}

function getObligationsDueToDateThisMonth(today = new Date()) {
  const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
  return expandObligationOccurrences(monthStart, today);
}

function getObligationsScheduledThisMonth(today = new Date()) {
  const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
  const monthEnd = new Date(today.getFullYear(), today.getMonth() + 1, 0);
  return expandObligationOccurrences(monthStart, monthEnd);
}

function getUpcomingObligations(days = 14, today = new Date()) {
  const endDate = addDays(today, days);
  return expandObligationOccurrences(today, endDate);
}

function getExpectedIncomeOccurrences(days = 14, today = new Date()) {
  const endDate = addDays(today, days);
  const occurrences = [];

  const pushMonthlyIncome = () => {
    let d = new Date(today.getFullYear(), today.getMonth(), 14);
    if (d < today) d = addMonths(d, 1);

    while (d <= endDate) {
      occurrences.push({
        name: "Steve salary",
        amount: expectedIncome.steveMonthly,
        date: toISODateLocal(d),
        parsedDate: new Date(d)
      });
      d = addMonths(d, 1);
    }
  };

  const pushFortnightlyIncome = () => {
    let d = parseLocalISODate("2026-05-05");

    while (d < today) {
      d = addDays(d, 14);
    }

    while (d <= endDate) {
      occurrences.push({
        name: "Lou salary",
        amount: expectedIncome.louFortnightly,
        date: toISODateLocal(d),
        parsedDate: new Date(d)
      });
      d = addDays(d, 14);
    }
  };

  pushMonthlyIncome();
  pushFortnightlyIncome();

  return occurrences.sort((a, b) => a.parsedDate - b.parsedDate);
}

function formatShortDate(dateString) {
  const date = parseLocalISODate(dateString);
  return date.toLocaleDateString("en-AU", { day: "numeric", month: "short" });
}

function obligationTotal(list) {
  return list.reduce((sum, item) => sum + Number(item.amount || 0), 0);
}

function getScheduledCategoriesSet() {
  const set = new Set();
  getActiveObligations().forEach(o => set.add(o.parent_category));
  return set;
}

      .filter(o => o.parent_category === parent)
      .reduce((sum, o) => sum + Number(o.amount || 0), 0);

    const comparisonBudget = viewMode === "monthly"
      ? isScheduledCategory
        ? scheduledDueTotalForParent
        : monthlyBudget
      : monthlyBudget * monthsElapsed;

    const actual = activeTotals[parent] || 0;

    let resultText = getCategoryResultText(parent, actual, comparisonBudget, viewMode);
    let resultClass = getCategoryResultClass(parent, actual, comparisonBudget);
    let status = getCategoryStatus(actual, comparisonBudget || monthlyBudget, parent);

    if (isScheduledCategory) {
      const difference = comparisonBudget - actual;

      if (comparisonBudget === 0 && actual === 0) {
        resultText = "Nothing due yet";
        resultClass = "good";
        status = { label: "On track", cls: "status-good", fill: "progress-fill", pct: 0 };
      } else if (difference <= 0) {
        resultText = difference === 0 ? "On track" : dollars(Math.abs(difference)) + " ahead";
        resultClass = "good";
        status = { label: "On track", cls: "status-good", fill: "progress-fill", pct: 100 };
      } else {
        resultText = dollars(difference) + " due";
        resultClass = "bad";
        status = {
          label: "Payment due",
          cls: "status-bad",
          fill: "progress-fill bad",
          pct: comparisonBudget ? Math.min((actual / comparisonBudget) * 100, 100) : 0
        };
      }
    }

    const subTotals = getSubTotals(parent, viewMode === "monthly" ? "month" : "accrual");

    const topSubText = viewMode === "monthly"
      ? isScheduledCategory
        ? `${dollars(actual)} paid · ${dollars(comparisonBudget)} due so far`
        : `${dollars(actual)} of ${dollars(monthlyBudget)} used`
      : `Accrued ${dollars(comparisonBudget)} · Spent ${dollars(actual)}`;

    const detailLine = viewMode === "monthly"
      ? isScheduledCategory
        ? `Scheduled this month: ${dollars(scheduledMonthTotalForParent)} · Due so far: ${dollars(scheduledDueTotalForParent)}`
        : `Monthly budget: ${dollars(monthlyBudget)} · Actual: ${dollars(actual)}`
      : `Monthly accrual: ${dollars(monthlyBudget)} · Months elapsed: ${monthsElapsed}`;

    const emptyText = viewMode === "monthly"
      ? "No spend this month"
      : "No spend since budget start";

    const subBreakdown = Object.keys(subTotals).length
      ? Object.entries(subTotals).sort((a, b) => b[1] - a[1]).map(([sub, amount]) => `
        <div class="sub-row"><span>${sub}</span><strong>${dollars(amount)}</strong></div>
      `).join("")
      : `<div class="empty">${emptyText}</div>`;

    return `
      <details class="category-card">
        <summary>
          <div class="category-top">
            <div>
              <div class="category-name">${parent}</div>
              <div class="category-sub">${topSubText}</div>
              <span class="status-chip ${status.cls}">${status.label}</span>
            </div>
            <div class="category-amount ${resultClass}">
              ${resultText}
            </div>
          </div>
          <div class="progress">
            <div class="${status.fill}" style="width:${status.pct}%"></div>
          </div>
        </summary>
        <div class="budget-line">${detailLine}</div>
        <div>${subBreakdown}</div>
      </details>
    `;
  }).join("");

  return `
    <section class="hero-card">
      <div class="hero-label">Tracking this month</div>
      <div class="hero-value">
        ${
          viewMode === "monthly"
            ? spendVsPlanBalance >= 0
              ? dollars(spendVsPlanBalance) + " under plan"
              : dollars(Math.abs(spendVsPlanBalance)) + " over plan"
            : accrualSummary.balance >= 0
              ? dollars(accrualSummary.balance) + " ahead"
              : dollars(Math.abs(accrualSummary.balance)) + " behind"
        }
      </div>
      <div class="hero-context">
        ${
          viewMode === "monthly"
            ? "Based on spend so far vs plan"
            : "Based on smoothed budget vs actual spend since budget start"
        }
      </div>
      <div class="hero-grid">
        <div class="hero-metric">
          <span>${viewMode === "monthly" ? "Plan so far" : "Budget accrued"}</span>
          <strong>${viewMode === "monthly" ? dollars(budgetAccruedToDate) : dollars(accrualSummary.totalBudgetAccrued)}</strong>
        </div>
        <div class="hero-metric">
          <span>${viewMode === "monthly" ? "Spent so far" : "Actual spend"}</span>
          <strong>${viewMode === "monthly" ? dollars(monthlySummary.expenses) : dollars(accrualSummary.totalActualSpent)}</strong>
        </div>
      </div>
      <div class="hero-context">
        Biggest spend: <strong>${biggestDriver}${biggestDriverAmount ? " · " + dollars(biggestDriverAmount) : ""}</strong>
      </div>
    </section>


    <div class="section-title">
      <h2>Upcoming Cashflow</h2>
      <span>Known commitments only</span>
    </div>
    <section class="summary">
      <div class="window-toggle">
        <button class="${cashflowWindowDays === 14 ? "active" : ""}" onclick="setCashflowWindow(14)">Next 14 days</button>
        <button class="${cashflowWindowDays === 30 ? "active" : ""}" onclick="setCashflowWindow(30)">Next 30 days</button>
      </div>
      <div class="metric-row"><span>Current available cash</span><strong>${dollars(currentAvailableCash)}</strong></div>
      <div class="metric-row"><span>Expected income</span><strong class="good">+${dollars(upcomingIncomeTotal)}</strong></div>
      <div class="metric-row"><span>Scheduled obligations</span><strong class="bad">-${dollars(upcomingObligationsTotal)}</strong></div>
      <div class="metric-row total"><span>Available after obligations</span><strong>${dollars(expectedAvailableCash)}</strong></div>
      <details>
        <summary class="muted">View upcoming obligations</summary>
        ${
          upcomingObligations.length
            ? upcomingObligations.slice(0, 8).map(o => `
              <div class="sub-row"><span>${formatShortDate(o.occurrence_date)} · ${o.name}</span><strong>${dollars(o.amount)}</strong></div>
            `).join("")
            : `<div class="empty">No scheduled obligations in this window.</div>`
        }
      </details>
    </section>

    ${healthCards}

    <div class="section-title">
      <h2>Dashboard view</h2>
      <span>${activeSubtitle}</span>
    </div>
    <div class="mode-toggle">
      <button class="${viewMode === "monthly" ? "active" : ""}" onclick="setViewMode('monthly')">Monthly</button>
      <button class="${viewMode === "accrual" ? "active" : ""}" onclick="setViewMode('accrual')">Accrual</button>
    </div>
    <div class="mode-note">${activeNote}</div>

    <details class="panel">
      <summary><strong>Financial details</strong></summary>
    <div class="section-title">
      <h2>This Month Cash View</h2>
      <span>Income timing is separate from spend tracking</span>
    </div>
    <section class="summary">
      <p class="muted">Expected income reflects Steve monthly pay and Lou fortnightly pay normalised to a monthly figure. Scheduled obligations are based on configured due dates, not daily accrual.</p>

      <div class="metric-row"><span>Expected income this month</span><strong>${dollars(expectedMonthlyIncome)}</strong></div>
      <div class="metric-row"><span>Income received so far</span><strong>${dollars(monthlySummary.income)}</strong></div>
      <div class="progress">
        <div class="progress-fill" style="width:${expectedIncomeReceivedPct}%"></div>
      </div>

      <div class="metric-row"><span>Obligations scheduled this month</span><strong>${dollars(obligationsScheduledMonthTotal)}</strong></div>
      <div class="metric-row"><span>Obligations due so far</span><strong>${dollars(obligationsDueToDateTotal)}</strong></div>
      <div class="metric-row"><span>Available after obligations</span><strong>${dollars(expectedAvailableAfterObligations)}</strong></div>
      <div class="metric-row"><span>Flexible expected expenses</span><strong>${dollars(flexibleBudgetTotal)}</strong></div>
      <div class="metric-row total"><span>Total scheduled outflows</span><strong>${dollars(scheduledMonthlyOutflows)}</strong></div>

      <div class="metric-row"><span>Expenses paid so far</span><strong>${dollars(monthlySummary.expenses)}</strong></div>
      <div class="metric-row total"><span>Expected monthly surplus</span><strong class="${expectedMonthlySurplus >= 0 ? "good" : "bad"}">${dollars(expectedMonthlySurplus)}</strong></div>
      <div class="metric-row"><span>Actual cash position so far</span><strong class="${monthlySummary.surplus >= 0 ? "good" : "bad"}">${dollars(monthlySummary.surplus)}</strong></div>
    </section>

    </details>

    <div class="section-title">
      <h2>Category Balance</h2>
      <span>Accrual truth</span>
    </div>
    <section class="summary">
      <p class="muted">Accrual view from ${budgetStartDate}. This smooths annual, quarterly and uneven bills.</p>
      <div class="metric-row"><span>Budget accrued</span><strong>${dollars(accrualSummary.totalBudgetAccrued)}</strong></div>
      <div class="metric-row"><span>Actual spent</span><strong>${dollars(accrualSummary.totalActualSpent)}</strong></div>
      <div class="metric-row total">
        <span>Overall balance</span>
        <strong class="${accrualSummary.balance >= 0 ? "good" : "bad"}">
          ${accrualSummary.balance >= 0 ? dollars(accrualSummary.balance) + " ahead" : dollars(Math.abs(accrualSummary.balance)) + " behind"}
        </strong>
      </div>
    </section>

    <div class="section-title">
      <h2>${activeTitle}</h2>
      <span>Tap to drill down</span>
    </div>
    ${categoryRows}
  `;
}

function parentOptions(selected = "") {
  return Object.keys(categoryModel)
    .filter(parent => parent !== "Needs Review")
    .map(parent => `<option value="${parent}" ${parent === selected ? "selected" : ""}>${parent}</option>`)
    .join("");
}

function getAllSubcategories(parent) {
  const base = categoryModel[parent] || [];
  const custom = customSubcategories
    .filter(item => item.active !== false && item.parent_category === parent)
    .map(item => item.sub_category);

  return [...new Set([...base, ...custom])].sort((a, b) => a.localeCompare(b));
}

function subOptions(parent, selected = "") {
  return getAllSubcategories(parent)
    .map(sub => `<option value="${sub}" ${sub === selected ? "selected" : ""}>${sub}</option>`)
    .join("");
}

function setEditingObligation(id) {
  editingObligationId = id;
  render();
}

function setEditingMapping(id) {
  editingMappingId = id;
  render();
}

function cancelSettingsEdit() {
  editingObligationId = null;
  editingMappingId = null;
  render();
}

function updateObligationSubCategories(parentValue) {
  const subSelect = document.getElementById("obligationSub");
  if (!subSelect) return;
  subSelect.innerHTML = subOptions(parentValue);
}

function updateMappingSubCategories(parentValue) {
  const subSelect = document.getElementById("mappingSub");
  if (!subSelect) return;
  subSelect.innerHTML = subOptions(parentValue);
}

async function saveObligationFromForm(e) {
  e.preventDefault();
  const form = e.target;

  const finalSubcategory = form.custom_subcategory.value.trim() || form.sub_category.value;

  if (form.custom_subcategory.value.trim()) {
    await ensureCustomSubcategory(form.parent_category.value, finalSubcategory);
  }

  await saveObligation({
    id: form.id.value || uuid(),
    name: form.name.value.trim(),
    amount: toNumber(form.amount.value),
    frequency: form.frequency.value,
    next_due_date: form.next_due_date.value,
    parent_category: form.parent_category.value,
    sub_category: finalSubcategory,
    active: form.active.checked
  });

  editingObligationId = null;
}

async function saveMappingFromForm(e) {
  e.preventDefault();
  const form = e.target;

  const finalSubcategory = form.custom_subcategory.value.trim() || form.sub_category.value;

  if (form.custom_subcategory.value.trim()) {
    await ensureCustomSubcategory(form.parent_category.value, finalSubcategory);
  }

  await saveMapping({
    id: form.id.value || uuid(),
    pattern: form.pattern.value.trim(),
    parent_category: form.parent_category.value,
    sub_category: finalSubcategory,
    active: form.active.checked
  });

  editingMappingId = null;
}

function renderObligationModal() {
  if (editingObligationId === null) return "";

  const existing = obligations.find(o => String(o.id) === String(editingObligationId));
  const o = existing || {
    id: "",
    name: "",
    amount: "",
    frequency: "monthly",
    next_due_date: toISODateLocal(new Date()),
    parent_category: "Household",
    sub_category: categoryModel["Household"][0],
    active: true
  };

  return `
    <div class="edit-overlay">
      <div class="edit-sheet">
        <h2>${existing ? "Edit Obligation" : "Add Obligation"}</h2>
        <p class="muted">Scheduled obligations control when known bills are counted in the plan.</p>

        <form onsubmit="saveObligationFromForm(event)">
          <input type="hidden" name="id" value="${o.id || ""}" />
          <input type="text" name="name" value="${String(o.name || "").replace(/"/g, "&quot;")}" placeholder="Name, e.g. Mortgage" required />
          <input type="number" step="0.01" name="amount" value="${o.amount}" placeholder="Amount" required />

          <select name="frequency" required>
            ${["weekly", "fortnightly", "monthly", "quarterly", "annually"].map(f => `<option value="${f}" ${f === o.frequency ? "selected" : ""}>${f[0].toUpperCase() + f.slice(1)}</option>`).join("")}
          </select>

          <input type="date" name="next_due_date" value="${o.next_due_date}" required />

          <select name="parent_category" id="obligationParent" onchange="updateObligationSubCategories(this.value)" required>
            ${parentOptions(o.parent_category)}
          </select>

          <select name="sub_category" id="obligationSub" required>
            ${subOptions(o.parent_category, o.sub_category)}
          </select>

          <input type="text" name="custom_subcategory" placeholder="Or add new subcategory" />

          <label class="inline-toggle">
            <input type="checkbox" name="active" ${o.active !== false ? "checked" : ""} />
            Active
          </label>

          <div class="edit-actions">
            <button type="button" class="secondary" onclick="cancelSettingsEdit()">Cancel</button>
            <button type="submit" class="primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  `;
}

function renderMappingModal() {
  if (editingMappingId === null) return "";

  const existing = mappings.find(m => String(m.id) === String(editingMappingId));
  const m = existing || {
    id: "",
    pattern: "",
    parent_category: "Lifestyle",
    sub_category: categoryModel["Lifestyle"][0],
    active: true
  };

  return `
    <div class="edit-overlay">
      <div class="edit-sheet">
        <h2>${existing ? "Edit Mapping Rule" : "Add Mapping Rule"}</h2>
        <p class="muted">Mapping rules classify future imports when the description contains this pattern.</p>

        <form onsubmit="saveMappingFromForm(event)">
          <input type="hidden" name="id" value="${m.id || ""}" />
          <input type="text" name="pattern" value="${String(m.pattern || "").replace(/"/g, "&quot;")}" placeholder="Pattern, e.g. NETFLIX" required />

          <select name="parent_category" id="mappingParent" onchange="updateMappingSubCategories(this.value)" required>
            ${parentOptions(m.parent_category)}
          </select>

          <select name="sub_category" id="mappingSub" required>
            ${subOptions(m.parent_category, m.sub_category)}
          </select>

          <input type="text" name="custom_subcategory" placeholder="Or add new subcategory" />

          <label class="inline-toggle">
            <input type="checkbox" name="active" ${m.active !== false ? "checked" : ""} />
            Active
          </label>

          <div class="edit-actions">
            <button type="button" class="secondary" onclick="cancelSettingsEdit()">Cancel</button>
            <button type="submit" class="primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  `;
}

function renderSettings() {
  const activeObligations = obligations.filter(o => o.active !== false);
  const inactiveObligations = obligations.filter(o => o.active === false);
  const activeMappings = mappings.filter(m => m.active !== false);
  const inactiveMappings = mappings.filter(m => m.active === false);

  const renderObligationCard = o => `
    <div class="settings-card">
      <div class="settings-card-header">
        <div>
          <div class="settings-card-title">${o.name}</div>
          <div class="settings-card-meta">${o.frequency} · next ${formatShortDate(o.next_due_date)}</div>
          <div class="settings-card-meta">${o.parent_category} · ${o.sub_category}</div>
          <span class="badge ${o.active === false ? "off" : ""}">${o.active === false ? "Inactive" : "Active"}</span>
        </div>
        <div class="settings-card-amount">${dollarsExact(o.amount)}</div>
      </div>
      <div class="settings-actions">
        <button onclick="setEditingObligation('${o.id}')">Edit</button>
        <button onclick="deleteObligation('${o.id}')">Delete</button>
      </div>
    </div>
  `;

  const renderMappingCard = m => `
    <div class="settings-card">
      <div class="settings-card-header">
        <div>
          <div class="settings-card-title">${m.pattern}</div>
          <div class="settings-card-meta">${m.parent_category} · ${m.sub_category}</div>
          <span class="badge ${m.active === false ? "off" : ""}">${m.active === false ? "Inactive" : "Active"}</span>
        </div>
      </div>
      <div class="settings-actions">
        <button onclick="setEditingMapping('${m.id}')">Edit</button>
        <button onclick="deleteMapping('${m.id}')">Delete</button>
      </div>
    </div>
  `;

  return `
    <section class="hero-card">
      <div class="hero-label">Settings</div>
      <div class="hero-value">Rules & obligations</div>
      <div class="hero-context">Configure known bills and remembered transaction mappings without changing code.</div>
    </section>

    <div class="section-title">
      <h2>Scheduled Obligations</h2>
      <span>${activeObligations.length} active</span>
    </div>
    <section class="panel">
      <p class="muted">Known recurring bills are counted when they are due, not smoothed daily.</p>
      <button class="primary" onclick="setEditingObligation('new')">Add Obligation</button>
    </section>
    <div class="settings-grid">
      ${activeObligations.length ? activeObligations.map(renderObligationCard).join("") : `<p class="muted">No active obligations yet.</p>`}
      ${inactiveObligations.length ? `<details class="panel"><summary><strong>Inactive obligations</strong></summary>${inactiveObligations.map(renderObligationCard).join("")}</details>` : ""}
    </div>

    <div class="section-title">
      <h2>Mapping Rules</h2>
      <span>${activeMappings.length} active</span>
    </div>
    <section class="panel">
      <p class="muted">Mapping rules reduce Needs Review by remembering stable merchant patterns.</p>
      <button class="primary" onclick="setEditingMapping('new')">Add Mapping Rule</button>
    </section>
    <div class="settings-grid">
      ${activeMappings.length ? activeMappings.map(renderMappingCard).join("") : `<p class="muted">No active mapping rules yet.</p>`}
      ${inactiveMappings.length ? `<details class="panel"><summary><strong>Inactive mapping rules</strong></summary>${inactiveMappings.map(renderMappingCard).join("")}</details>` : ""}
    </div>

    ${renderObligationModal()}
    ${renderMappingModal()}
  `;
}

function renderTransactionHistory() {
  const parentOptions = Object.keys(categoryModel)
    .map(parent => `<option value="${parent}">${parent}</option>`)
    .join("");

  const needsReview = getNeedsReviewTransactions();
  const needsReviewTotal = needsReview.reduce((sum, t) => sum + Math.abs(t.amount), 0);
  const allTransactions = getAllVisibleTransactions();

  const renderList = list => list.length
    ? list.map(t => `
      <div class="transaction">
        <div>
          <strong>${t.sub}</strong>
          <div class="muted">${t.parent} · ${t.date}${t.note ? " · " + t.note : ""}</div>
          ${t.type === "needs_review" ? `<span class="pill">Needs review</span>` : ""}
        </div>
        <div>
          <strong>${t.amount < 0 ? "-" : "+"}${dollarsExact(Math.abs(t.amount))}</strong>
          <div class="transaction-actions">
            <button onclick="editTransaction('${t.id}')">Edit</button>
            <button onclick="deleteTransaction('${t.id}')">Delete</button>
          </div>
        </div>
      </div>
    `).join("")
    : `<p class="muted">No transactions to show.</p>`;

  return `
    <section class="panel">
      <h2>Import CSV</h2>
      <p class="muted">Import CBA CSVs. Transfers and credit card repayments are hidden. ATM withdrawals and unmapped items go to Needs Review.</p>
      <input type="file" accept=".csv" multiple onchange="handleCSVUpload(event)" />
    </section>

    <section class="panel">
      <h2>Add Transaction</h2>
      <form onsubmit="addTransaction(event)">
        <input type="date" name="date" required />
        <input type="number" step="0.01" name="amount" placeholder="Amount (+ income / - expense)" required />

        <select name="parent" id="parent" onchange="updateSubCategories(this.value)" required>
          ${parentOptions}
        </select>

        <select name="sub" id="sub" required></select>

        <input type="text" name="note" placeholder="Note / merchant" />
        <button class="primary">Add Transaction</button>
      </form>
    </section>

    <div class="section-title">
      <h2>Needs Review</h2>
      <span>${needsReview.length} items · ${dollars(needsReviewTotal)} unallocated</span>
    </div>
    ${renderList(needsReview)}

    <div class="section-title">
      <h2>All Visible Transactions</h2>
      <span>${allTransactions.length} items</span>
    </div>
    <p class="muted">Hidden transfers and credit card repayments do not appear here.</p>
    ${renderList(allTransactions)}

    ${renderEditModal()}
  `;
}

function render() {
  const bodyContent = appLoading
    ? `<section class="loading-card">Loading shared household data…</section>`
    : appError
    ? `<section class="loading-card"><strong>Sync issue</strong><p>${appError}</p></section>`
    : `${
        activeTab === "dashboard"
          ? renderDashboard()
          : activeTab === "transactions"
          ? renderTransactionHistory()
          : activeTab === "settings"
          ? renderSettings()
          : renderWealth()
      }`;

  document.getElementById("app").innerHTML = `
    <main>
      <div class="app-header">
        <h1 class="app-title">Goodman Finances Inc.</h1>
        <div class="app-subtitle">Household financial control system · v18</div>
      </div>

      <div class="tabs">
        <button class="${activeTab === "wealth" ? "active" : ""}" onclick="setTab('wealth')">Wealth</button>
        <button class="${activeTab === "dashboard" ? "active" : ""}" onclick="setTab('dashboard')">Budget</button>
        <button class="${activeTab === "transactions" ? "active" : ""}" onclick="setTab('transactions')">Transactions</button>
        <button class="${activeTab === "settings" ? "active" : ""}" onclick="setTab('settings')">Settings</button>
      </div>

      ${bodyContent}
    </main>
  `;

  if (activeTab === "transactions") {
    const parentEl = document.getElementById("parent");
    if (parentEl) updateSubCategories(parentEl.value);
  }
}

loadSharedData();
</script>
</body>
</html>
