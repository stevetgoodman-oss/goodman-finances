function isSupabaseConfigured() {
  return (
    SUPABASE_URL &&
    SUPABASE_ANON_KEY &&
    !SUPABASE_ANON_KEY.includes("PASTE_YOUR_ANON")
  );
}

function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();

  return "10000000-1000-4000-8000-100000000000".replace(/[018]/g, c =>
    (+c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> +c / 4).toString(16)
  );
}

function isUuid(value) {
  return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(value || ""));
}

function ensureTransactionIds() {
  transactions.forEach(t => {
    if (!isUuid(t.id)) t.id = uuid();
  });
}

function transactionDbRow(t) {
  return {
    id: t.id,
    date: t.date,
    amount: Number(t.amount || 0),
    parent: t.parent || "",
    sub: t.sub || "",
    note: t.note || "",
    type: t.type || "obligation",
    hidden: !!t.hidden,
    is_reimbursement: !!t.is_reimbursement
  };
}

async function supabaseFetch(path, options = {}) {
  if (!isSupabaseConfigured()) return null;

  const response = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json",
      ...(options.headers || {})
    }
  });

  if (!response.ok) {
    const text = await response.text();
    throw new Error(text || `Supabase request failed: ${response.status}`);
  }

  if (response.status === 204) return null;

  const body = await response.text();
  return body ? JSON.parse(body) : null;
}

function cashflowDbRow(item) {
  return {
    id: isUuid(item.id) ? item.id : uuid(),
    type: item.type || "obligation",
    name: item.name,
    amount: Number(item.amount || 0),
    frequency: item.frequency,
    next_due_date: item.next_due_date,
    parent_category: item.parent_category,
    sub_category: item.sub_category,
    active: !!item.active
  };
}

function mappingDbRow(item) {
  return {
    id: isUuid(item.id) ? item.id : uuid(),
    pattern: normaliseText(item.pattern),
    parent_category: item.parent_category,
    sub_category: item.sub_category,
    active: !!item.active
  };
}



function ensureDefaultTransactionMappings() {
  defaultTransactionMappings.forEach(defaultItem => {
    const exists = mappings.some(item =>
      normaliseText(item.pattern) === normaliseText(defaultItem.pattern)
    );

    if (!exists) {
      mappings.push({
        ...defaultItem,
        id: uuid()
      });
    }
  });
}

function ensureDefaultScheduledCashflows() {
  defaultScheduledCashflows.forEach(defaultItem => {
    const exists = scheduledCashflows.some(item =>
      normaliseText(item.name) === normaliseText(defaultItem.name) &&
      (item.type || "obligation") === (defaultItem.type || "obligation")
    );

    if (!exists) {
      scheduledCashflows.push({
        ...defaultItem,
        id: uuid()
      });
    }
  });
}


function budgetDbRow(parent, amount) {
  return {
    parent_category: parent,
    monthly_budget: Number(amount || 0),
    active: true
  };
}

async function syncBudgetsToSupabase() {
  localStorage.setItem("budget_categories", JSON.stringify(budgets));

  if (!isSupabaseConfigured()) return;

  const rows = Object.entries(budgets).map(([parent, amount]) => budgetDbRow(parent, amount));

  if (rows.length) {
    await supabaseFetch("budget_categories?on_conflict=parent_category", {
      method: "POST",
      headers: { Prefer: "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify(rows)
    });
  }
}

function ensureDefaultBudgets() {
  Object.entries(defaultBudgets).forEach(([parent, amount]) => {
    if (budgets[parent] === undefined || budgets[parent] === null) {
      budgets[parent] = amount;
    }
  });
}

async function fetchBudgets() {
  budgets = { ...defaultBudgets };

  if (!isSupabaseConfigured()) {
    const localBudgets = JSON.parse(localStorage.getItem("budget_categories") || "{}");
    budgets = { ...defaultBudgets, ...localBudgets };
    ensureDefaultBudgets();
    localStorage.setItem("budget_categories", JSON.stringify(budgets));
    return;
  }

  const rows = await supabaseFetch("budget_categories?select=*&order=parent_category.asc");
  const loaded = {};

  (rows || []).forEach(row => {
    if (row.active !== false) {
      loaded[row.parent_category] = Number(row.monthly_budget || 0);
    }
  });

  budgets = { ...defaultBudgets, ...loaded };

  const beforeKeys = new Set(Object.keys(loaded));
  ensureDefaultBudgets();

  const missingDefaults = Object.keys(defaultBudgets).some(parent => !beforeKeys.has(parent));
  if (missingDefaults) {
    await syncBudgetsToSupabase();
  }
}

async function fetchConfigTables() {
  if (!isSupabaseConfigured()) {
    scheduledCashflows = JSON.parse(localStorage.getItem("scheduled_cashflows") || JSON.stringify(defaultScheduledCashflows));
    ensureDefaultScheduledCashflows();
    localStorage.setItem("scheduled_cashflows", JSON.stringify(scheduledCashflows));
    mappings = JSON.parse(localStorage.getItem("transaction_mappings") || "[]");
    ensureDefaultTransactionMappings();
    localStorage.setItem("transaction_mappings", JSON.stringify(mappings));
    customSubcategories = JSON.parse(localStorage.getItem("custom_subcategories") || "[]");
    return;
  }

  const cashflowRows = await supabaseFetch("scheduled_obligations?select=*&order=next_due_date.asc");
  scheduledCashflows = (cashflowRows || []).map(row => ({
    id: row.id,
    type: row.type || "obligation",
    name: row.name,
    amount: Number(row.amount || 0),
    frequency: row.frequency,
    next_due_date: row.next_due_date,
    parent_category: row.parent_category,
    sub_category: row.sub_category,
    active: !!row.active
  }));

  const beforeDefaultCount = scheduledCashflows.length;
  ensureDefaultScheduledCashflows();

  if (scheduledCashflows.length > beforeDefaultCount) {
    await syncScheduledCashflowsToSupabase();
  }

  const mappingRows = await supabaseFetch("transaction_mappings?select=*&order=created_at.asc");
  mappings = (mappingRows || []).map(row => ({
    id: row.id,
    pattern: row.pattern,
    parent_category: row.parent_category,
    sub_category: row.sub_category,
    active: !!row.active
  }));

  const beforeMappingDefaultCount = mappings.length;
  ensureDefaultTransactionMappings();

  if (mappings.length > beforeMappingDefaultCount) {
    await syncMappingsToSupabase();
  }

  const subcategoryRows = await supabaseFetch("custom_subcategories?select=*&order=parent_category.asc");
  customSubcategories = (subcategoryRows || []).map(row => ({
    id: row.id,
    parent_category: row.parent_category,
    sub_category: row.sub_category,
    active: !!row.active
  }));
}

async function ensureCustomSubcategory(parent, subcategory) {
  const clean = String(subcategory || "").trim();
  if (!parent || !clean) return;

  const existsInBase = (categoryModel[parent] || []).some(sub => normaliseText(sub) === normaliseText(clean));
  const existsCustom = customSubcategories.some(
    item =>
      item.active !== false &&
      item.parent_category === parent &&
      normaliseText(item.sub_category) === normaliseText(clean)
  );

  if (!existsInBase && !existsCustom) {
    customSubcategories.push({
      id: uuid(),
      parent_category: parent,
      sub_category: clean,
      active: true
    });

    await syncCustomSubcategoriesToSupabase();
  }
}

async function loadSharedData() {
  appLoading = true;
  appError = "";
  render();

  try {
    if (!isSupabaseConfigured()) {
      await fetchConfigTables();
      await fetchBudgets();
      transactions = JSON.parse(localStorage.getItem("transactions") || "[]");
      wealth = JSON.parse(localStorage.getItem("wealth") || JSON.stringify(defaultWealth));
      wealth = {
        ...defaultWealth,
        ...wealth,
        baseline: { ...defaultWealth.baseline, ...(wealth.baseline || {}) },
        current: { ...defaultWealth.current, ...(wealth.current || {}) }
      };
      appLoading = false;
      render();
      return;
    }

    await fetchConfigTables();
    await fetchBudgets();

    const txRows = await supabaseFetch("transactions?select=*&order=date.desc");
    transactions = (txRows || []).map(row => ({
      id: row.id,
      date: row.date,
      amount: Number(row.amount || 0),
      parent: row.parent,
      sub: row.sub,
      note: row.note,
      type: row.type,
      hidden: !!row.hidden,
      is_reimbursement: !!row.is_reimbursement
    }));

    const wealthRows = await supabaseFetch("wealth?select=*&id=eq.1");

    if (wealthRows && wealthRows.length && wealthRows[0].data) {
      wealth = wealthRows[0].data;
    } else {
      wealth = JSON.parse(localStorage.getItem("wealth") || JSON.stringify(defaultWealth));
      await syncWealthToSupabase();
    }

    wealth = {
      ...defaultWealth,
      ...wealth,
      baseline: { ...defaultWealth.baseline, ...(wealth.baseline || {}) },
      current: { ...defaultWealth.current, ...(wealth.current || {}) }
    };

    localStorage.setItem("transactions", JSON.stringify(transactions));
    localStorage.setItem("wealth", JSON.stringify(wealth));

    appLoading = false;
    render();
  } catch (error) {
    console.error(error);
    appError = "Could not load shared data. Check your Supabase tables, keys and policies.";
    appLoading = false;
    render();
  }
}

async function save() {
  ensureTransactionIds();
  localStorage.setItem("transactions", JSON.stringify(transactions));

  try {

function dollars(value, decimals = 0) {
  return "$" + Number(value || 0).toLocaleString("en-AU", {
    minimumFractionDigits: decimals,
    maximumFractionDigits: decimals
  });
}

function dollarsExact(value) {
  return "$" + Number(value || 0).toLocaleString("en-AU", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function normaliseText(text) {
  return String(text || "").toUpperCase().trim();
}

function parseDate(value) {
  if (!value) return "";
  const raw = String(value).trim();

  if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;

  const parts = raw.split(/[\/\-]/);
  if (parts.length === 3) {
    let [d, m, y] = parts;
    if (y.length === 2) y = "20" + y;
    return `${y.padStart(4, "0")}-${m.padStart(2, "0")}-${d.padStart(2, "0")}`;
  }

  return raw;
}

function isOnOrAfterBudgetStart(dateString) {
  return new Date(dateString) >= new Date(budgetStartDate);
}

function isThisMonth(dateString) {
  const d = new Date(dateString);
  const now = new Date();

  return (
    d.getMonth() === now.getMonth() &&
    d.getFullYear() === now.getFullYear() &&
    isOnOrAfterBudgetStart(dateString)
  );
}

function monthsElapsedSinceBudgetStart() {
  const start = new Date(budgetStartDate);
  const now = new Date();

  if (now < start) return 0;

  return (
    (now.getFullYear() - start.getFullYear()) * 12 +
    (now.getMonth() - start.getMonth()) +
    1
  );
}

function isTargetCategory(parent) {
  return categoryBehaviour[parent] === "target";
}

function transactionCountsForBudget(t) {
  return t.type === "expense" || !!t.is_reimbursement;
}

function transactionCountsForIncome(t) {
  return t.type === "income" && !t.is_reimbursement;
}

function expenseValue(t) {
  // Purchases are usually negative. Refunds/returns are positive and should reduce actual spend.
  if (t.amount < 0) return Math.abs(t.amount);
  return -Math.abs(t.amount);
}

function getVisibleTransactions() {
  return transactions.filter(t => !t.hidden);
}

function getThisMonthTransactions() {
  return getVisibleTransactions().filter(t => isThisMonth(t.date));
}

function getTransactionsSinceBudgetStart() {
  return getVisibleTransactions().filter(t => isOnOrAfterBudgetStart(t.date));
}

function getAllVisibleTransactions() {
  return getVisibleTransactions()
    .slice()
    .sort((a, b) => new Date(b.date) - new Date(a.date));
}

function getNeedsReviewTransactions() {
  return getVisibleTransactions()
    .filter(t => t.type === "needs_review")
    .slice()
    .sort((a, b) => new Date(b.date) - new Date(a.date));
}

function getThisMonthParentTotals() {
  const totals = {};
  Object.keys(budgets).forEach(cat => totals[cat] = 0);

  getThisMonthTransactions().forEach(t => {
    if (transactionCountsForBudget(t) && totals[t.parent] !== undefined) {
      totals[t.parent] += expenseValue(t);
    }
  });

  return totals;
}

function getAccrualParentTotals() {
  const totals = {};
  Object.keys(budgets).forEach(cat => totals[cat] = 0);

  getTransactionsSinceBudgetStart().forEach(t => {
    if (transactionCountsForBudget(t) && totals[t.parent] !== undefined) {
      totals[t.parent] += expenseValue(t);
    }
  });

  return totals;
}

function getSubTotals(parent, mode = "month") {
  const totals = {};
  const txSource =
    mode === "accrual"
      ? getTransactionsSinceBudgetStart()
      : getThisMonthTransactions();

  txSource
    .filter(t => t.parent === parent && transactionCountsForBudget(t))
    .forEach(t => {
      totals[t.sub] = (totals[t.sub] || 0) + expenseValue(t);
    });

  return totals;
}

function getMonthlySummary() {
  const monthTx = getThisMonthTransactions();

  const income = monthTx
    .filter(transactionCountsForIncome)
    .reduce((sum, t) => sum + Math.abs(t.amount), 0);

  const expenses = monthTx
    .filter(transactionCountsForBudget)
    .reduce((sum, t) => sum + expenseValue(t), 0);

  return { income, expenses, surplus: income - expenses };
}

function getAccrualSummary() {
  const monthsElapsed = monthsElapsedSinceBudgetStart();
  const accrualTotals = getAccrualParentTotals();

  let totalBudgetAccrued = 0;
  let totalActualSpent = 0;

  Object.keys(budgets).forEach(parent => {
    totalBudgetAccrued += budgets[parent] * monthsElapsed;
    totalActualSpent += accrualTotals[parent] || 0;
  });

  return {
    monthsElapsed,
    totalBudgetAccrued,
    totalActualSpent,
    balance: totalBudgetAccrued - totalActualSpent
  };
}

function getCategoryStatus(actual, budget, parent) {
  if (budget === 0) return { label: "Tracking", cls: "status-good", fill: "progress-fill", pct: 0 };

  const pct = actual / budget;
  const cappedPct = Math.min(pct * 100, 100);

  if (isTargetCategory(parent)) {
    if (pct >= 1) return { label: "Target met", cls: "status-good", fill: "progress-fill", pct: cappedPct };
    if (pct >= 0.8) return { label: "Close", cls: "status-watch", fill: "progress-fill watch", pct: cappedPct };
    return { label: "Behind target", cls: "status-bad", fill: "progress-fill bad", pct: cappedPct };
  }

  if (pct > 1) return { label: "Over", cls: "status-bad", fill: "progress-fill bad", pct: cappedPct };
  if (pct >= 0.8) return { label: "Watch", cls: "status-watch", fill: "progress-fill watch", pct: cappedPct };
  return { label: "Healthy", cls: "status-good", fill: "progress-fill", pct: cappedPct };
}

function getCategoryResultText(parent, actual, budget, mode) {
  const difference = budget - actual;

  if (isTargetCategory(parent)) {
    if (difference <= 0) return dollars(Math.abs(difference)) + " over target";
    return dollars(difference) + " short of target";
  }

  if (mode === "monthly") {
    if (difference >= 0) return dollars(difference) + " remaining";
    return dollars(Math.abs(difference)) + " over";
  }

  if (difference >= 0) return dollars(difference) + " ahead";
  return dollars(Math.abs(difference)) + " behind";
}

function getCategoryResultClass(parent, actual, budget) {
  const difference = budget - actual;

  if (isTargetCategory(parent)) {
    return difference <= 0 ? "good" : "bad";
  }

  return difference >= 0 ? "good" : "bad";
}

async function saveEditedTransaction(e) {
  e.preventDefault();

  const t = transactions.find(tx => String(tx.id) === String(editingId));
  if (!t) return;

  const form = e.target;
  const parent = form.parent.value;
  const amount = parseFloat(form.amount.value);
  const customSubcategoryInput = form.customSubcategory ? form.customSubcategory.value.trim() : "";
  const finalSub = customSubcategoryInput || form.sub.value;
  const isReimbursement = amount > 0 && form.isReimbursement && form.isReimbursement.checked;

  if (customSubcategoryInput) {
    await ensureCustomSubcategory(parent, finalSub);
  }

  t.amount = amount;
  t.date = form.date.value;
  t.parent = parent;
  t.sub = finalSub;
  t.note = form.note.value;
  t.hidden = false;
  t.is_reimbursement = isReimbursement;

  if (isReimbursement) {
    t.type = "obligation";
  } else if (parent === "Income") {
    t.type = "income";
  } else if (parent === "Needs Review") {
    t.type = "needs_review";
  } else if (parent === "Exclude") {
    t.type = "ignored";
    t.hidden = true;
  } else {
    t.type = "expense";
  }

  if (!isReimbursement && form.rememberMapping && form.rememberMapping.checked && form.mappingPattern.value.trim()) {
    await saveMapping({
      id: uuid(),
      pattern: form.mappingPattern.value.trim(),
      parent_category: parent,
      sub_category: finalSub,
      active: true
    });
  }

  editingId = null;
  await save();
}

function parseCSV(text) {
  const rows = [];
  let current = "";
  let row = [];
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const next = text[i + 1];

    if (char === '"' && inQuotes && next === '"') {
      current += '"';
      i++;
    } else if (char === '"') {
      inQuotes = !inQuotes;
    } else if (char === "," && !inQuotes) {
      row.push(current.trim());
      current = "";
    } else if ((char === "\n" || char === "\r") && !inQuotes) {
      if (current || row.length) {
        row.push(current.trim());
        rows.push(row);
      }
      current = "";
      row = [];
      if (char === "\r" && next === "\n") i++;
    } else {
      current += char;
    }
  }

  if (current || row.length) {
    row.push(current.trim());
    rows.push(row);
  }

  return rows;
}

function classifyTransaction(description, amount) {
  const d = normaliseText(description);

  if (d.includes("ATM") || d.includes("CASH WITHDRAWAL")) {
    return { type: "needs_review", parent: "Needs Review", sub: "ATM Withdrawal", hidden: false };
  }

  // Income
  if (
    d.includes("SALARY") ||
    d.includes("PAYROLL") ||
    d.includes("WAGES") ||
    d.includes("TELSTRA CORPORAT") ||
    d.includes("EML PAYMENTS") ||
    d.includes("DIR DEP EML")
  ) {
    return { type: "income", parent: "Income", sub: "Salary", hidden: false };
  }

  // Known payments that look like transfers but are real expenses
  if (d.includes("STARFISH SWIM")) {
    return { type: "expense", parent: "Kids", sub: "Kids swimming lessons", hidden: false };
  }

  // Manual/adhoc incoming transfers should be reviewed, not hidden
  if (d.includes("FAST TRANSFER FROM")) {
    return { type: "needs_review", parent: "Needs Review", sub: "Needs Review", hidden: false };
  }

  // Internal movements and credit card repayments
  if (
    d.includes("PAYMENT RECEIVED") ||
    d.includes("CREDIT CARD PAYMENT") ||
    d.includes("TRANSFER TO XX") ||
    d.includes("TRANSFER FROM XX") ||
    d.includes("HOME LOAN TRANSFER")
  ) {
    return { type: "ignored", parent: "Ignored", sub: "Internal Transfer", hidden: true };
  }

  const learnedRule = mappings
    .filter(rule => rule.active !== false && rule.pattern)
    .find(rule => d.includes(normaliseText(rule.pattern)));

  if (learnedRule) {
    return {
      type: learnedRule.parent_category === "Income" ? "income" : "expense",
      parent: learnedRule.parent_category,
      sub: learnedRule.sub_category,
      hidden: false
    };
  }

  if (amount > 0) {
    return { type: "income", parent: "Income", sub: "Other income", hidden: false };
  }

  return { type: "needs_review", parent: "Needs Review", sub: "Unmapped Transaction", hidden: false };
}
function makeFingerprint(tx) {
  return [tx.date, Number(tx.amount).toFixed(2), normaliseText(tx.note)].join("|");
}

function findColumn(headers, candidates) {
  const normalised = headers.map(h => normaliseText(h));

  for (const candidate of candidates) {
    const index = normalised.findIndex(h => h.includes(candidate));
    if (index !== -1) return index;
  }

  return -1;
}

function importCSVFile(file) {
  const reader = new FileReader();

  reader.onload = function(evt) {
    const rows = parseCSV(evt.target.result).filter(r => r.length > 1);

    if (rows.length < 2) {
      alert("No transactions found.");
      return;
    }

    const headers = rows[0];

    let dateIndex = findColumn(headers, ["DATE"]);
    let descIndex = findColumn(headers, ["DESCRIPTION", "TRANSACTION", "DETAILS", "NARRATIVE"]);
    let amountIndex = findColumn(headers, ["AMOUNT"]);
    let dataRows = rows.slice(1);

    if (dateIndex === -1 || descIndex === -1 || amountIndex === -1) {
      // CBA exports can arrive without headers. Fallback positional mapping:
      // Column A = date, Column B = amount, Column C = description.
      dateIndex = 0;
      amountIndex = 1;
      descIndex = 2;
      dataRows = rows;
    }

    const existing = new Set(transactions.map(makeFingerprint));

    let imported = 0;
    let skipped = 0;
    let ignored = 0;
    let needsReview = 0;

    dataRows.forEach(row => {
      const date = parseDate(row[dateIndex]);
      const note = row[descIndex];
      const amount = parseFloat(String(row[amountIndex]).replace(/[$,]/g, ""));

      if (!date || !note || isNaN(amount)) return;

      const classification = classifyTransaction(note, amount);

      const tx = {
        id: uuid(),
        date,
        amount,
        type: classification.type,
        parent: classification.parent,
        sub: classification.sub,
        note,
        hidden: classification.hidden,
        imported: true,
        is_reimbursement: false
      };

      const fingerprint = makeFingerprint(tx);

      if (existing.has(fingerprint)) {
        skipped++;
        return;
      }

      existing.add(fingerprint);
      transactions.push(tx);
      imported++;

      if (tx.hidden) ignored++;
      if (tx.type === "needs_review") needsReview++;
    });

    save();

    alert(`Import complete. Imported ${imported}. Skipped duplicates ${skipped}. Hidden transfers ${ignored}. Needs review ${needsReview}.`);
  };

  reader.readAsText(file);
}

function handleCSVUpload(e) {
  const files = Array.from(e.target.files || []);
  files.forEach(importCSVFile);
  e.target.value = "";
}


async function syncWealthToSupabase() {
  if (!isSupabaseConfigured()) {
    localStorage.setItem("wealth", JSON.stringify(wealth));
    return;
  }

  await supabaseFetch("wealth?on_conflict=id", {
    method: "POST",
    headers: {
      Prefer: "resolution=merge-duplicates,return=minimal"
    },
    body: JSON.stringify([{ id: 1, data: wealth }])
  });
}

async function saveWealth() {
  localStorage.setItem("wealth", JSON.stringify(wealth));
  render();

  try {
    await syncWealthToSupabase();
  } catch (error) {
    console.error(error);
    alert("Could not sync wealth snapshot to Supabase. Your browser copy is still saved locally.");
  }
}

function toNumber(value) {
  const n = parseFloat(String(value || "0").replace(/[$,]/g, ""));
  return isNaN(n) ? 0 : n;
}

function getWealthTotals(snapshot) {
  const superTotal = toNumber(snapshot.superSteve) + toNumber(snapshot.superLou);
  const etfTotal = toNumber(snapshot.etfVgs) + toNumber(snapshot.etfVas);
  const assets =
    toNumber(snapshot.property) +
    toNumber(snapshot.householdCash) +
    superTotal +
    etfTotal +
    toNumber(snapshot.cash);

  const netWealth = assets - toNumber(snapshot.mortgage);
  const liquidity = toNumber(snapshot.cash) + toNumber(snapshot.redraw);

  return {
    superTotal,
    etfTotal,
    assets,
    netWealth,
    liquidity
  };
}

function getWealthSummary() {
  const baseline = getWealthTotals(wealth.baseline);
  const current = getWealthTotals(wealth.current);

  const netDelta = current.netWealth - baseline.netWealth;
  const netDeltaPct = baseline.netWealth ? (netDelta / baseline.netWealth) * 100 : 0;

  return { baseline, current, netDelta, netDeltaPct };
}

function movementLabel(current, baseline, invert = false) {
  const delta = current - baseline;
  if (delta === 0) return "No movement";

  if (invert) {
    return delta < 0 ? "Improved" : "Increased";
  }

  return delta > 0 ? "Increased" : "Decreased";
}

function deltaText(current, baseline, invert = false) {
  const delta = current - baseline;
  const pct = baseline ? (delta / baseline) * 100 : 0;
  const sign = delta >= 0 ? "+" : "-";
  const absText = dollars(Math.abs(delta));
  const pctText = Math.abs(pct).toFixed(1) + "%";

  const displayDelta = `${sign}${absText} (${sign}${pctText})`;
  return displayDelta;
}

function deltaClass(current, baseline, invert = false) {
  const delta = current - baseline;
  if (delta === 0) return "";
  if (invert) return delta < 0 ? "good" : "bad";
  return delta > 0 ? "good" : "bad";
}

function parseLocalISODate(dateString) {
  const [year, month, day] = String(dateString).split("-").map(Number);
  return new Date(year, month - 1, day);
}

function toISODateLocal(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function addDays(date, days) {
  const d = new Date(date);
  d.setDate(d.getDate() + days);
  return d;
}

function addMonths(date, months) {
  const d = new Date(date);
  const targetDay = d.getDate();
  d.setMonth(d.getMonth() + months);

  if (d.getDate() !== targetDay) {
    d.setDate(0);
  }

  return d;
}

function getNextOccurrenceDate(date, frequency) {
  const f = String(frequency || "").toLowerCase();

  if (f === "weekly") return addDays(date, 7);
  if (f === "fortnightly") return addDays(date, 14);
  if (f === "monthly") return addMonths(date, 1);
  if (f === "quarterly") return addMonths(date, 3);
  if (f === "annually") return addMonths(date, 12);

  return addMonths(date, 1);
}

function isSameMonthAndYear(dateA, dateB) {
  return dateA.getFullYear() === dateB.getFullYear() &&
    dateA.getMonth() === dateB.getMonth();
}

function getActiveCashflows(type = null) {
  return scheduledCashflows.filter(item =>
    item.active !== false &&
    (!type || item.type === type)
  );
}

function expandCashflowOccurrences(startDate, endDate, type = null) {
  const occurrences = [];

  getActiveCashflows(type).forEach(item => {
    let occurrenceDate = parseLocalISODate(item.next_due_date);
    let guard = 0;

    while (occurrenceDate < startDate && guard < 300) {
      occurrenceDate = getNextOccurrenceDate(occurrenceDate, item.frequency);
      guard++;
    }

    while (occurrenceDate <= endDate && guard < 400) {
      occurrences.push({
        ...item,
        occurrence_date: toISODateLocal(occurrenceDate),
        occurrenceDate
      });

      occurrenceDate = getNextOccurrenceDate(occurrenceDate, item.frequency);
      guard++;
    }
  });

  return occurrences.sort((a, b) => a.occurrenceDate - b.occurrenceDate);
}

function getCashflowsDueToDateThisMonth(type = null, today = new Date()) {
  const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
  return expandCashflowOccurrences(monthStart, today, type);
}

function getCashflowsScheduledThisMonth(type = null, today = new Date()) {
  const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
  const monthEnd = new Date(today.getFullYear(), today.getMonth() + 1, 0);
  return expandCashflowOccurrences(monthStart, monthEnd, type);
}

function getUpcomingCashflows(days = 14, type = null, today = new Date()) {
  const endDate = addDays(today, days);
  return expandCashflowOccurrences(today, endDate, type);
}

function formatShortDate(dateString) {
  const date = parseLocalISODate(dateString);
  return date.toLocaleDateString("en-AU", { day: "numeric", month: "short" });
}

function cashflowTotal(list) {
  return list.reduce((sum, item) => sum + Number(item.amount || 0), 0);
}

function getScheduledCategoriesSet() {
  const set = new Set();
  getActiveCashflows("obligation").forEach(item => set.add(item.parent_category));
  return set;
}

function getAllSubcategories(parent) {
  const base = categoryModel[parent] || [];
  const custom = customSubcategories
    .filter(item => item.active !== false && item.parent_category === parent)
    .map(item => item.sub_category);

  return [...new Set([...base, ...custom])].sort((a, b) => a.localeCompare(b));
}

function parentOptions(selected = "", includeIncome = false) {

function groupCashflowsByDate(items) {
  return items.reduce((groups, item) => {
    const key = item.occurrence_date || item.date || "";
    if (!groups[key]) groups[key] = [];
    groups[key].push(item);
    return groups;
  }, {});
}

              </div>
            `).join("")
            : `<div class="empty">No scheduled cashflows in this window.</div>`

function aggregateScheduledBySubcategory(items) {
  return items.reduce((totals, item) => {
    const sub = item.sub_category || "Uncategorised";
    totals[sub] = (totals[sub] || 0) + Number(item.amount || 0);
    return totals;
  }, {});
}


function renderDashboard() {
  const monthlySummary = getMonthlySummary();
  const monthlyParentTotals = getThisMonthParentTotals();
  const needsReview = getNeedsReviewTransactions();
  const needsReviewCount = needsReview.length;
  const needsReviewTotal = needsReview.reduce((sum, t) => sum + Math.abs(t.amount), 0);

  const today = new Date();
  const expensesDueThisMonth = getCashflowsDueToDateThisMonth("obligation", today);
  const expensesScheduledThisMonth = getCashflowsScheduledThisMonth("obligation", today);
  const incomeScheduledThisMonth = getCashflowsScheduledThisMonth("income", today);

  const plannedSpendSoFar = cashflowTotal(expensesDueThisMonth);
  const plannedSpendThisMonth = cashflowTotal(expensesScheduledThisMonth);
  const expectedMonthlyIncome = cashflowTotal(incomeScheduledThisMonth);
  const spendVsPlanBalance = plannedSpendSoFar - monthlySummary.expenses;

  const upcomingExpenses = getUpcomingCashflows(cashflowWindowDays, "obligation", today);
  const upcomingIncome = getUpcomingCashflows(cashflowWindowDays, "income", today);
  const upcomingExpensesTotal = cashflowTotal(upcomingExpenses);
  const upcomingIncomeTotal = cashflowTotal(upcomingIncome);
  const currentAvailableCash = toNumber(wealth.current.householdCash);
  const expectedAvailableCash = currentAvailableCash + upcomingIncomeTotal - upcomingExpensesTotal;
  const allUpcomingCashflows = [...upcomingIncome.map(i => ({ ...i, direction: "+" })), ...upcomingExpenses.map(o => ({ ...o, direction: "-" }))]
    .sort((a, b) => a.occurrenceDate - b.occurrenceDate);

  const parentPlanTotals = {};
  expensesScheduledThisMonth.forEach(item => {
    parentPlanTotals[item.parent_category] = (parentPlanTotals[item.parent_category] || 0) + Number(item.amount || 0);
  });

  const parentPlanDueTotals = {};
  expensesDueThisMonth.forEach(item => {
    parentPlanDueTotals[item.parent_category] = (parentPlanDueTotals[item.parent_category] || 0) + Number(item.amount || 0);
  });

  let biggestDriver = "No spending yet";
  let biggestDriverAmount = 0;
  const driverEntries = Object.entries(monthlyParentTotals)
    .filter(([parent, amount]) => amount > 0)
    .sort((a, b) => b[1] - a[1]);

  if (driverEntries.length) {
    biggestDriver = driverEntries[0][0];
    biggestDriverAmount = driverEntries[0][1];
  }

  const healthCards = `
    <div class="health-grid" id="budget-review">
      <div class="health-card">
        <span class="label">Planned this month</span>
        <strong class="value">${dollars(plannedSpendThisMonth)}</strong>
        <div class="note">Scheduled expenses</div>
      </div>
      <div class="health-card">
        <span class="label">Actual spend</span>
        <strong class="value">${dollars(monthlySummary.expenses)}</strong>
        <div class="note">Matched transactions</div>
      </div>
      <div class="health-card">
        <span class="label">Needs review</span>
        <strong class="value">${needsReviewCount}</strong>
        <div class="note">${needsReviewCount ? dollars(needsReviewTotal) + " requires classification" : "All clear"}</div>
      </div>
    </div>
  `;

  const plannedParents = [...new Set([
    ...Object.keys(parentPlanTotals),
    ...Object.keys(monthlyParentTotals)
  ])].filter(parent => parent !== "Income" && parent !== "Needs Review" && parent !== "Exclude");

  const categoryRows = plannedParents.length
    ? plannedParents.map(parent => {
        const plannedMonth = parentPlanTotals[parent] || 0;
        const plannedDue = parentPlanDueTotals[parent] || 0;
        const actual = monthlyParentTotals[parent] || 0;
        const difference = plannedDue - actual;
        const pct = plannedDue ? Math.min((actual / plannedDue) * 100, 100) : actual > 0 ? 100 : 0;

        const resultText = plannedDue === 0 && actual > 0
          ? `${dollars(actual)} unplanned`
          : difference >= 0
          ? `${dollars(difference)} remaining`
          : `${dollars(Math.abs(difference))} over`;

        const resultClass = plannedDue === 0 && actual > 0
          ? "bad"
          : difference >= 0
          ? "good"
          : "bad";

        const status = plannedDue === 0 && actual > 0
          ? { label: "Unplanned", cls: "status-bad", fill: "progress-fill bad", pct }
          : difference >= 0
          ? { label: "On plan", cls: "status-good", fill: "progress-fill", pct }
          : { label: "Over", cls: "status-bad", fill: "progress-fill bad", pct };

        const subTotals = getSubTotals(parent, "month");
        const scheduledItems = expensesScheduledThisMonth.filter(item => item.parent_category === parent);

        return `
          <details class="category-card plan-card">
            <summary>
              <div class="plan-card-top">
                <div class="plan-card-title">${parent}</div>
                <span class="plan-card-status ${resultClass}">${status.label}</span>
              </div>
              <div class="plan-card-meta">${dollars(actual)} spent · ${dollars(plannedDue)} due so far</div>
              <div class="plan-card-result ${resultClass}">${resultText}</div>
              <div class="progress"><div class="${status.fill}" style="width:${status.pct}%"></div></div>
            </summary>
            <div class="metric-row"><span>Scheduled this month</span><strong>${dollars(plannedMonth)}</strong></div>
            <div class="metric-row"><span>Due so far</span><strong>${dollars(plannedDue)}</strong></div>
            <div class="metric-row"><span>Actual spend</span><strong>${dollars(actual)}</strong></div>
            ${
              scheduledItems.length
                ? `<div class="sub-breakdown">
                    <div class="budget-section-heading">Scheduled this month</div>
                    ${Object.entries(aggregateScheduledBySubcategory(scheduledItems)).sort((a,b) => b[1]-a[1]).map(([sub, amount]) => `<div class="sub-row"><span>${sub}</span><strong>${dollars(amount)}</strong></div>`).join("")}
                  </div>`
                : `<div class="empty">No scheduled expenses for this category this month.</div>`
            }
            ${
              Object.keys(subTotals).length
                ? `<div class="sub-breakdown">
                    <div class="budget-section-heading">Actual by subcategory</div>
                    ${Object.entries(subTotals).sort((a,b) => b[1]-a[1]).map(([sub, amount]) => `
                      <div class="sub-row"><span>${sub}</span><strong>${dollars(amount)}</strong></div>
                    `).join("")}
                  </div>`
                : ""
            }
          </details>
        `;
      }).join("")
    : `<section class="panel"><p class="muted">No scheduled expenses yet. Add planned expenses in Settings.</p></section>`;

  return `
    <section class="hero-card" id="budget-overview">
      <div class="hero-label">Tracking this month</div>
      <div class="hero-value">${dollars(Math.abs(spendVsPlanBalance))} ${spendVsPlanBalance >= 0 ? "under plan" : "over plan"}</div>
      <div class="hero-context">Based on actual spend vs scheduled expenses due so far</div>
      <div class="hero-metrics">
        <div>
          <span>Plan so far</span>
          <strong>${dollars(plannedSpendSoFar)}</strong>
        </div>
        <div>
          <span>Spent so far</span>
          <strong>${dollars(monthlySummary.expenses)}</strong>
        </div>
      </div>
      <div class="hero-context">Biggest spend: <strong>${biggestDriver}${biggestDriverAmount ? " · " + dollars(biggestDriverAmount) : ""}</strong></div>
    </section>

    <div class="section-title" id="budget-upcoming">
      <h2>Upcoming Cashflow</h2>
      <span>Known commitments only</span>
    </div>
    <section class="summary">
      <div class="window-toggle">
        <button class="${cashflowWindowDays === 14 ? "active" : ""}" onclick="setCashflowWindow(14)">Next 14 days</button>
        <button class="${cashflowWindowDays === 30 ? "active" : ""}" onclick="setCashflowWindow(30)">Next 30 days</button>
      </div>
      <div class="metric-row"><span>Household cash</span><strong>${dollars(currentAvailableCash)}</strong></div>
      <div class="metric-row"><span>Expected income</span><strong class="good">+${dollars(upcomingIncomeTotal)}</strong></div>
      <div class="metric-row"><span>Scheduled expenses</span><strong class="bad">-${dollars(upcomingExpensesTotal)}</strong></div>
      <div class="metric-row total"><span>Available after expenses</span><strong>${dollars(expectedAvailableCash)}</strong></div>
      <details class="cashflow-preview">
        <summary class="muted">View scheduled cashflows</summary>
        ${
          allUpcomingCashflows
            .slice(0, 10)
            .map(item => `
              <div class="sub-row"><span>${formatShortDate(item.occurrence_date)} · ${item.name}</span><strong class="${item.direction === "+" ? "good" : "bad"}">${item.direction}${dollars(item.amount)}</strong></div>
            `).join("") || `<div class="empty">No scheduled cashflows in this window.</div>`
        }
        ${
          allUpcomingCashflows.length > 10
            ? `<button class="view-all-link" onclick="setCashflowModal(true)">View all scheduled cashflows →</button>`
            : ""
        }
      </details>
    </section>
    ${renderAllCashflowsSheet(allUpcomingCashflows, cashflowWindowDays)}

    ${healthCards}

    <div class="section-title" id="budget-categories">
      <h2>This Month vs Plan</h2>
      <span>Tap to drill down</span>
    </div>
    ${categoryRows}
  `;
}

async function saveCashflowFromForm(e) {
  e.preventDefault();
  const form = e.target;
  const finalSubcategory = form.custom_subcategory.value.trim() || form.sub_category.value;

  if (form.custom_subcategory.value.trim()) {
    await ensureCustomSubcategory(form.parent_category.value, finalSubcategory);
  }

  await saveScheduledCashflow({
    id: form.id.value || uuid(),
    type: form.type.value,
    name: form.name.value.trim(),
    amount: toNumber(form.amount.value),
    frequency: form.frequency.value,
    next_due_date: form.next_due_date.value,
    parent_category: form.parent_category.value,
    sub_category: finalSubcategory,
    active: form.active.checked
  });

  editingCashflowId = null;
}

async function saveMappingFromForm(e) {
  e.preventDefault();
  const form = e.target;
  const finalSubcategory = form.custom_subcategory.value.trim() || form.sub_category.value;

  if (form.custom_subcategory.value.trim()) {
    await ensureCustomSubcategory(form.parent_category.value, finalSubcategory);
  }

  await saveMapping({
    id: form.id.value || uuid(),
    pattern: form.pattern.value.trim(),
    parent_category: form.parent_category.value,
    sub_category: finalSubcategory,
    active: form.active.checked
  });

  editingMappingId = null;
}

function renderTransactionHistory() {
  const parentOptions = Object.keys(categoryModel)
    .map(parent => `<option value="${parent}">${parent}</option>`)
    .join("");

  const needsReview = getNeedsReviewTransactions();
  const needsReviewTotal = needsReview.reduce((sum, t) => sum + Math.abs(t.amount), 0);
  const allTransactions = getAllVisibleTransactions();

  const renderList = list => list.length
    ? list.map(t => `
      <div class="transaction">
        <div>
          <strong>${t.sub}</strong>
          <div class="muted">${t.parent} · ${t.date}${t.note ? " · " + t.note : ""}</div>
          ${t.type === "needs_review" ? `<span class="pill">Needs review</span>` : ""}
          ${t.is_reimbursement ? `<span class="pill">Reimbursement</span>` : ""}
        </div>
        <div>
          <strong>${t.amount < 0 ? "-" : "+"}${dollarsExact(Math.abs(t.amount))}</strong>
          <div class="transaction-actions">
            <button onclick="editTransaction('${t.id}')">Edit</button>
            <button onclick="deleteTransaction('${t.id}')">Delete</button>
          </div>
        </div>
      </div>
    `).join("")
    : `<p class="muted">No transactions to show.</p>`;

  return `
    <section class="panel" id="tx-import">
      <h2>Import CSV</h2>
      <p class="muted">Import CBA CSVs. Transfers and credit card repayments are hidden. ATM withdrawals and unmapped items go to Needs Review.</p>
      <input type="file" accept=".csv" multiple onchange="handleCSVUpload(event)" />
    </section>

    <section class="panel" id="tx-add">
      <h2>Add Transaction</h2>
      <form onsubmit="addTransaction(event)">
        <input type="date" name="date" required />
        <input type="number" step="0.01" name="amount" placeholder="Amount (+ income / - expense)" required />

        <select name="parent" id="parent" onchange="updateSubCategories(this.value)" required>
          ${parentOptions}
        </select>

        <select name="sub" id="sub" required></select>

        <input type="text" name="note" placeholder="Note / merchant" />
        <button class="primary">Add Transaction</button>
      </form>
    </section>

    <div class="section-title" id="tx-review">
      <h2>Needs Review</h2>
      <span>${needsReview.length} items · ${dollars(needsReviewTotal)} unallocated</span>
    </div>
    ${renderList(needsReview)}

    <div class="section-title">
      <h2>All Visible Transactions</h2>
      <span>${allTransactions.length} items</span>
    </div>
    <p class="muted">Hidden transfers and credit card repayments do not appear here.</p>
    ${renderList(allTransactions)}

    ${renderEditModal()}
  `;
}

          ? renderSettings()
          : renderWealth()
      }`;

  document.getElementById("app").innerHTML = `
    <main>
